            const [data, setData] = useState(initialDatabaseState);

            useEffect(() => {
                let isAuthFallback = false;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Auth error:", error);
                        isAuthFallback = true;
                        setUser({ uid: 'demo-user-123' });
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    if (!isAuthFallback && u) setUser(u);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                
                const dbRef = ref(db, `users/${user.uid}/bawabati_db`);
                
                const unsubscribe = onValue(dbRef, (snapshot) => {
                    if (snapshot.exists()) {
                        setData(snapshot.val());
                        setLoading(false);
                    } else {
                        set(dbRef, initialDatabaseState)
                            .then(() => setLoading(false))
                            .catch((error) => {
                                console.error("DB Write Error (Permissions?):", error);
                                setData(initialDatabaseState);
                                setLoading(false);
                            });
                    }
                }, (error) => {
                    console.error("DB Read error:", error);
                    setData(initialDatabaseState);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, [user]);

            const updateData = async (key, newValue) => {
                if (!user) return;
                setData(prev => ({ ...prev, [key]: newValue }));
                try {
                    const specificRef = ref(db, `users/${user.uid}/bawabati_db/${key}`);
                    await set(specificRef, newValue);
                } catch (error) {
                    console.error("Update error:", error);
                }
            };

            if (loading) return (
                <div className="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-dark-bg">
                    <div className="animate-spin rounded-full h-16 w-16 border-4 border-primary border-t-transparent shadow-lg"></div>
                </div>
            );

            return <AppContext.Provider value={{ data, updateData }}>{children}</AppContext.Provider>;
        };

            </button>

        const Chatbot = ({ t }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState([{ id: 1, text: "مرحباً بك! أنا سند، مساعدك الأكاديمي. كيف يمكنني خدمتك اليوم؟", sender: 'bot' }]);
            const [input, setInput] = useState("");
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); };
            useEffect(() => { scrollToBottom(); }, [messages, isOpen]);

            const handleSend = () => {
                if (!input.trim()) return;
                setMessages(prev => [...prev, { id: Date.now(), text: input, sender: 'user' }]);
                setInput("");
                setTimeout(() => {
                    setMessages(prev => [...prev, { id: Date.now() + 1, text: "تم استلام رسالتك", sender: 'bot' }]);
                }, 1000);
            };

                                ))}
                                <div ref={messagesEndRef} />
                            </div>

                </div>
            );
        };

        const OfficeHoursBookPage = ({ onBack, lang }) => {
            const isAr = lang === 'ar';
            return (
                <div className="animate-fade-in space-y-6">
                    <HeaderPage title={isAr ? "حجز ساعات" : "Book Hours"} onBack={onBack} lang={lang} />
                    <div className="bg-white dark:bg-dark-card p-10 rounded-2xl text-center text-gray-500 border border-gray-200 dark:border-gray-700">محتوى تجريبي</div>
                </div>
            );
        };

        const OfficeHoursViewPage = ({ onBack, lang }) => {
            const isAr = lang === 'ar';
            return (
                <div className="animate-fade-in space-y-6">
                    <HeaderPage title={isAr ? "مواعيدي" : "My Hours"} onBack={onBack} lang={lang} />
                    <div className="bg-white dark:bg-dark-card p-10 rounded-2xl text-center text-gray-500 border border-gray-200 dark:border-gray-700">محتوى تجريبي</div>
                </div>
            );
        };

        const NewRecommendationPage = ({ onBack, lang }) => {
            const isAr = lang === 'ar';
            return (
                <div className="animate-fade-in space-y-6">
                    <HeaderPage title={isAr ? "طلب توصية" : "New Recommendation"} onBack={onBack} lang={lang} />
                    <div className="bg-white dark:bg-dark-card p-10 rounded-2xl text-center text-gray-500 border border-gray-200 dark:border-gray-700">محتوى تجريبي</div>
                </div>
            );
        };

        const ViewRecommendationsPage = ({ onBack, lang }) => {
            const isAr = lang === 'ar';
            return (
                <div className="animate-fade-in space-y-6">
                    <HeaderPage title={isAr ? "التوصيات" : "Recommendations"} onBack={onBack} lang={lang} />
                    <div className="bg-white dark:bg-dark-card p-10 rounded-2xl text-center text-gray-500 border border-gray-200 dark:border-gray-700">محتوى تجريبي</div>
                </div>
            );
        };

        const PersonalPage = ({ onBack, activeView, lang }) => {
            const isAr = lang === 'ar';
            return (
                <div className="animate-fade-in space-y-6">
                    <HeaderPage title={isAr ? "شخصي" : "Personal"} onBack={onBack} lang={lang} />
                    <div className="bg-white dark:bg-dark-card p-10 rounded-2xl text-center text-gray-500 border border-gray-200 dark:border-gray-700">محتوى تجريبي - {activeView}</div>
                </div>
            );
        };

        const UserAccountPage = ({ onBack, lang }) => {
            const isAr = lang === 'ar';
            return (
                <div className="animate-fade-in space-y-6">
                    <HeaderPage title={isAr ? "حسابي" : "Account"} onBack={onBack} lang={lang} />
                    <div className="bg-white dark:bg-dark-card p-10 rounded-2xl text-center text-gray-500 border border-gray-200 dark:border-gray-700">محتوى تجريبي</div>
                </div>
            );
        };

        const HomeView = ({ t, openService, lang }) => {
            const isAr = lang === 'ar';
            const { data } = useContext(AppContext);
            const std = data.studentData || {};
            const completed = std.completedHours || 0;
            const current = std.currentHours || 0;
            const remaining = (std.totalHours || 0) - (completed + current);
            const total = std.totalHours || 1;
            const completedPct = (completed / total) * 100;
            const currentPct = (current / total) * 100;

            const upcomingExams = data.exams || [];
            const attendanceData = data.attendanceStats || [];

            return (
                <div className="space-y-8 animate-fade-in">
                    <div>
                        <h3 className="text-sm font-bold text-gray-400 uppercase mb-4 tracking-wider flex items-center gap-2"><div className="w-1 h-4 bg-primary rounded-full"></div> {t.quickActions}</h3>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                            <ActionCard icon={<Calendar size={24}/>} title={t.schedule} onClick={() => openService('schedule')} />
                            <ActionCard icon={<FileText size={24}/>} title={t.results} onClick={() => openService('results')} color="gold" />
                            <ActionCard icon={<RefreshCw size={24}/>} title={t.addDrop} onClick={() => openService('addDrop')} color="blue" />
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 bg-primary rounded-2xl p-8 text-white shadow-xl relative overflow-hidden group flex flex-col justify-between">
                            <div className="absolute top-0 right-0 w-full h-full opacity-[0.07] bg-[url('https://www.transparenttextures.com/patterns/arabesque.png')]"></div>
                            <div className="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8">
                                <div><div className="inline-flex items-center gap-2 bg-black/20 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-medium text-teal-100 mb-4 border border-white/10"><TrendingUp size={14} className="text-gold" /> <span>{isAr ? std.typeAr : std.typeEn}</span></div><h2 className="text-6xl font-bold text-white mb-2 tracking-tighter">{std.gpa}</h2> <p className="text-teal-100 text-lg opacity-90">{t.gpa}</p></div>
                                <div className="bg-white/10 backdrop-blur-md p-4 rounded-xl border border-white/10 text-center min-w-[100px]"><span className="block text-3xl font-bold text-gold">{total}</span><span className="text-xs text-teal-100">{t['total-hours-label']}</span></div>
                            </div>
                            <div className="relative z-10 w-full">
                                <div className="flex justify-between text-xs text-teal-100 mb-2 font-medium"><span>{t.progress}</span><span>{Math.round(((completed + current)/total)*100)}%</span></div>
                                <div className="w-full h-4 bg-black/20 rounded-full overflow-hidden flex"><div className="h-full bg-white shadow-[0_0_10px_rgba(255,255,255,0.5)]" style={{ width: `${completedPct}%` }} title={`${t.hoursCompleted}: ${completed}`}></div><div className="h-full bg-gold shadow-[0_0_10px_rgba(177,142,81,0.5)]" style={{ width: `${currentPct}%` }} title={`${t.hoursCurrent}: ${current}`}></div></div>
                                <div className="grid grid-cols-3 gap-2 mt-4">
                                    <div className="bg-white/10 rounded-lg p-2 text-center border border-white/5"><div className="flex items-center justify-center gap-1.5 mb-1"><div className="w-2 h-2 rounded-full bg-white"></div><span className="text-[10px] text-teal-100">{t.hoursCompleted}</span></div><span className="text-lg font-bold text-white block leading-none">{completed}</span></div>
                                    <div className="bg-gold/20 rounded-lg p-2 text-center border border-gold/20"><div className="flex items-center justify-center gap-1.5 mb-1"><div className="w-2 h-2 rounded-full bg-gold"></div><span className="text-[10px] text-gold">{t.hoursCurrent}</span></div><span className="text-lg font-bold text-gold block leading-none">{current}</span></div>
                                    <div className="bg-black/20 rounded-lg p-2 text-center border border-white/5"><div className="flex items-center justify-center gap-1.5 mb-1"><div className="w-2 h-2 rounded-full bg-gray-400"></div><span className="text-[10px] text-gray-300">{t.hoursRemaining}</span></div><span className="text-lg font-bold text-gray-200 block leading-none">{remaining}</span></div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white dark:bg-dark-card rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col h-full min-h-[250px]">
                            <div className="p-4 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center bg-gray-50/50 dark:bg-gray-800/50"><h3 className="font-bold text-primary flex items-center gap-2 text-sm"><Clock size={16}/> {t.todaysLectures}</h3><div className="flex items-center gap-2"><span className="text-xs bg-primary/10 text-primary px-2 py-1 rounded font-bold">3</span><button onClick={() => openService('schedule')} className="text-xs text-primary font-bold hover:bg-primary/10 px-2 py-1 rounded transition">{t['view-all']}</button></div></div>
                            <div className="p-4 space-y-4 flex-1 overflow-y-auto">
                                <div className="flex gap-4 opacity-50"><div className="flex flex-col items-center"><div className="w-3 h-3 rounded-full bg-gray-300"></div><div className="w-0.5 h-full bg-gray-200 my-1"></div></div><div><h4 className="font-bold text-gray-500 text-sm line-through">{isAr ? "إحصاء هندسي" : "Engineering Statistics"}</h4><p className="text-xs text-gray-400">08:00 - 09:50</p></div></div>
                                <div className="flex gap-4"><div className="flex flex-col items-center"><div className="w-3 h-3 rounded-full bg-primary ring-4 ring-teal-100 animate-pulse"></div><div className="w-0.5 h-full bg-gray-200 my-1"></div></div><div className="bg-teal-50 p-3 rounded-lg border border-teal-100 w-full"><h4 className="font-bold text-primary text-sm">{isAr ? "تحليل كيميائي" : "Chemical Analysis"}</h4><p className="text-xs text-gray-600 mt-1">{isAr ? "معمل 3" : "Lab 3"} • {t.now}</p></div></div>
                                <div className="flex gap-4"><div className="flex flex-col items-center"><div className="w-3 h-3 rounded-full bg-gray-300 dark:bg-gray-600 border-2 border-white dark:border-dark-card"></div></div><div><h4 className="font-bold text-gray-700 dark:text-gray-300 text-sm">{isAr ? "تفاعل الإنسان والحاسب" : "HCI"}</h4><p className="text-xs text-gray-500">01:00 - 02:50 • {isAr ? "قاعة 12" : "Hall 12"}</p><span className="text-[10px] text-teal-600 font-bold bg-teal-50 px-1.5 rounded mt-1 inline-block">{t['upcoming-label']}</span></div></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const MainApp = () => {
            const [view, setView] = useState('home');
            const [activeCategory, setActiveCategory] = useState(null);
            const [darkMode, setDarkMode] = useState(false);
            const [lang, setLang] = useState('ar');
            const [menuOpen, setMenuOpen] = useState(false);
            const [zoomLevel, setZoomLevel] = useState(100);
            const [isReaderActive, setIsReaderActive] = useState(false);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [reduceMotion, setReduceMotion] = useState(false);
            const [highlightLinks, setHighlightLinks] = useState(false);

            const { data } = useContext(AppContext);

            useEffect(() => { document.documentElement.classList.toggle('dark', darkMode); }, [darkMode]);
            useEffect(() => { document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; }, [lang]);
            useEffect(() => { document.documentElement.style.fontSize = `${zoomLevel}%`; }, [zoomLevel]);
            useEffect(() => { if (reduceMotion) document.documentElement.classList.add('reduce-motion'); else document.documentElement.classList.remove('reduce-motion'); }, [reduceMotion]);
            useEffect(() => { if (highlightLinks) document.documentElement.classList.add('highlight-links'); else document.documentElement.classList.remove('highlight-links'); }, [highlightLinks]);

            useEffect(() => {
                const handleScreenClick = (e) => {
                    if (!isReaderActive) return;
                    window.speechSynthesis.cancel(); 
                    const textToRead = e.target.innerText || e.target.textContent;
                    if (textToRead && textToRead.trim() !== '') {
                        const utterance = new SpeechSynthesisUtterance(textToRead.trim());
                        utterance.lang = lang === 'ar' ? 'ar-SA' : 'en-US';
                        utterance.rate = 0.9; 
                        window.speechSynthesis.speak(utterance);
                    }
                };
                if (isReaderActive) document.addEventListener('click', handleScreenClick);
                else window.speechSynthesis.cancel();
                return () => document.removeEventListener('click', handleScreenClick);
            }, [isReaderActive, lang]);

            const toggleSpeech = () => setIsReaderActive(!isReaderActive);
            const t = translations[lang];
            const isAr = lang === 'ar';
            const goHome = () => setView('home');

            const menuItems = [
                { id: 'academic', icon: <GraduationCap size={20}/>, subItems: [{ id: 'schedule' }, { id: 'academic-events' }, { id: 'exams' }, { id: 'plan' }, { id: 'results' }, { id: 'absences' }, { id: 'record' }] },
                { id: 'registration', icon: <CheckCircle2 size={20}/>, subItems: [{ id: 'offered-courses' }, { id: 'addDrop' }, { id: 'dept-add' }, { id: 'dept-change' }, { id: 'dept-drop' }, { id: 'dept-multi' }, { id: 'reg-requests' }, { id: 'withdraw' }] },
                { id: 'requests', icon: <FileText size={20}/>, subItems: [{ id: 'academic-action-new' }, { id: 'academic-action-view' }, { id: 'major-change-new' }, { id: 'major-change-view' }, { id: 'recommendation-new' }, { id: 'recommendation-view' }, { id: 'office-hours-book' }, { id: 'office-hours-view' }] },
                { id: 'personal', icon: <User size={20}/>, subItems: [{ id: 'penalties' }, { id: 'rewards' }, { id: 'finance' }, { id: 'docs' }, { id: 'allowances' }, { id: 'id-photo' } ] }
            ];

            const toggleCategory = (id) => setActiveCategory(activeCategory === id ? null : id);
            const openNotifications = () => setView('notifications');

            const renderContent = () => {
                switch(view) {
                    case 'student-dashboard': return <StudentDashboardPage onBack={goHome} lang={lang} />; 
                    case 'notifications': return <NotificationsPage onBack={goHome} lang={lang} />; 
                    case 'academic-events': return <AcademicEventsPage onBack={goHome} lang={lang} />;
                    case 'schedule': return <SchedulePage onBack={goHome} t={t} lang={lang} />;
                    case 'plan': return <PlanPage onBack={goHome} t={t} lang={lang} />;
                    case 'results': return <ResultsPage onBack={goHome} t={t} lang={lang} onOpenNotifications={openNotifications} />;
                    case 'addDrop': return <AddDropPage onBack={goHome} lang={lang} />;
                    case 'offered-courses': return <OfferedCoursesPage onBack={goHome} lang={lang} />;
                    case 'dept-add': return <DepartmentRequestPage onBack={goHome} type="add" lang={lang} />;
                    case 'dept-change': return <DepartmentRequestPage onBack={goHome} type="change" lang={lang} />;
                    case 'dept-drop': return <DepartmentRequestPage onBack={goHome} type="drop" lang={lang} />;
                    case 'dept-multi': return <MultiRequestPage onBack={goHome} lang={lang} />; 
                    case 'reg-requests': return <RegistrationRequestsPage onBack={goHome} lang={lang} />;
                    case 'withdraw': return <WithdrawPage onBack={goHome} lang={lang} />;
                    case 'exams': return <ExamsPage onBack={goHome} lang={lang} />;
                    case 'e-reg': return <RegistrationPage onBack={goHome} lang={lang} />;
                    case 'absences': return <AbsencesPage onBack={goHome} lang={lang} />;
                    case 'record': return <AcademicRecordPage onBack={goHome} lang={lang} t={t} onOpenNotifications={openNotifications} />; 
                    case 'academic-action-new': return <NewAcademicActionPage onBack={goHome} lang={lang} />;
                    case 'academic-action-view': return <ViewAcademicActionsPage onBack={goHome} lang={lang} />;
                    case 'major-change-new': return <MajorChangeRequestPage onBack={goHome} lang={lang} />;
                    case 'major-change-view': return <ViewMajorChangeRequestsPage onBack={goHome} lang={lang} />;
                    case 'recommendation-new': return <NewRecommendationPage onBack={goHome} lang={lang} />; 
                    case 'recommendation-view': return <ViewRecommendationsPage onBack={goHome} lang={lang} />; 
                    case 'office-hours-book': return <OfficeHoursBookPage onBack={goHome} lang={lang} />;
                    case 'office-hours-view': return <OfficeHoursViewPage onBack={goHome} lang={lang} />;
                    case 'id-photo': return <PersonalPage onBack={goHome} activeView="id-photo" lang={lang} />;
                    case 'finance': return <PersonalPage onBack={goHome} activeView="finance" lang={lang} />;
                    case 'rewards': return <PersonalPage onBack={goHome} activeView="rewards" lang={lang} />;
                    case 'penalties': return <PersonalPage onBack={goHome} activeView="penalties" lang={lang} />;
                    case 'allowances': return <PersonalPage onBack={goHome} activeView="allowances" lang={lang} />;
                    case 'docs': return <PersonalPage onBack={goHome} activeView="docs" lang={lang} />;
                    case 'profile': return <PersonalPage onBack={goHome} activeView="id-photo" lang={lang} />; 
                    case 'user-account': return <UserAccountPage onBack={goHome} lang={lang} />;
                    default: return <HomeView t={t} openService={setView} lang={lang} />;
                }
            };

            return (
                <div className="min-h-screen relative flex">
                    <aside className={`md:flex flex-col w-72 bg-white dark:bg-dark-card border-l dark:border-l-0 dark:border-r border-gray-200 dark:border-gray-800 fixed top-0 bottom-0 z-40 shadow-sm transition-all duration-300 ${isAr ? 'right-0 border-l' : 'left-0 border-r'} ${menuOpen ? 'translate-x-0' : (isAr ? 'translate-x-full' : '-translate-x-full')} md:translate-x-0`}>
                        <div className="p-8 flex items-center gap-3 mb-2">
                            <div className="w-12 h-12 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg"><GraduationCap size={28}/></div>
                            <div><h1 className="font-bold text-xl tracking-tight text-primary dark:text-teal-400">{t.appTitle}</h1><p className="text-[10px] text-gray-400">{t.uniName}</p></div>
                        </div>
                        
                        <div className="px-4 mb-4 space-y-2">
                             <button onClick={() => setView('home')} className={`w-full flex items-center gap-4 px-4 py-3 rounded-lg text-sm font-bold transition-all ${view === 'home' ? 'bg-primary text-white shadow-md' : 'text-gray-600 hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-gray-800'}`}>
                                <LayoutDashboard size={20}/> {t.dashboard}
                            </button>
                             <button onClick={() => setView('student-dashboard')} className={`w-full flex items-center gap-4 px-4 py-3 rounded-lg text-sm font-bold transition-all ${view === 'student-dashboard' ? 'bg-primary text-white shadow-md' : 'text-gray-600 hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-gray-800'}`}>
                                <PieChart size={20}/> {t['student-dashboard']}
                            </button>
                        </div>

                        <nav className="flex-1 px-4 space-y-1 overflow-y-auto pb-4 custom-scrollbar">
                            {menuItems.map(cat => (
                                <div key={cat.id} className="rounded-lg overflow-hidden">
                                    <button onClick={() => toggleCategory(cat.id)} className={`w-full flex items-center justify-between px-4 py-3 text-sm font-bold transition-all ${activeCategory === cat.id ? 'bg-gray-50 dark:bg-gray-800/50 text-primary' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800'}`}>
                                        <div className="flex items-center gap-3">{cat.icon} {t[cat.id]}</div>
                                        <ChevronDown size={16} className={`transition-transform duration-300 ${activeCategory === cat.id ? 'rotate-180' : ''}`}/>
                                    </button>
                                    <div className={`overflow-hidden transition-all duration-300 ease-in-out ${activeCategory === cat.id ? 'max-h-96 opacity-100' : 'max-h-0 opacity-0'}`}>
                                        <div className="bg-gray-50 dark:bg-gray-800/30 py-2 pr-11 pl-4 space-y-1">
                                            {cat.subItems.map(item => (
                                                <button key={item.id} onClick={() => { setView(item.id); if(window.innerWidth < 768) setMenuOpen(false); }} className={`w-full text-right text-xs font-bold py-2 px-2 rounded-lg transition-colors flex items-center gap-2 ${view === item.id ? 'text-primary bg-primary/5' : 'text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white'}`}>
                                                    <div className={`w-1.5 h-1.5 rounded-full ${view === item.id ? 'bg-primary' : 'bg-gray-300'}`}></div>{t[item.id]}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </nav>

                        <div className="p-4 border-t border-gray-100 dark:border-gray-800">
                             <button onClick={() => { setView('user-account'); if(window.innerWidth < 768) setMenuOpen(false); }} className="w-full flex items-center gap-3 p-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 cursor-pointer transition text-right">
                                <div className="w-10 h-10 rounded-full bg-gray-200 overflow-hidden border border-gray-300"><div className="w-full h-full bg-gray-200 flex items-center justify-center text-gray-400"><User size={20}/></div></div>
                                <div className="overflow-hidden"><h4 className="font-bold text-xs truncate text-gray-800 dark:text-gray-200">{isAr ? data.studentData?.nameAr : data.studentData?.nameEn}</h4><p className="text-[10px] text-gray-400 truncate">{data.studentData?.id}</p></div>
                             </button>
                        </div>
                    </aside>
                    
                    {menuOpen && <div className="fixed inset-0 bg-black/50 z-30 md:hidden" onClick={() => setMenuOpen(false)}></div>}

                    <main className={`flex-1 w-full pb-20 md:pb-10 transition-all duration-300 ${isAr ? 'md:mr-72' : 'md:ml-72'}`}>
                        <header className="bg-white/80 dark:bg-dark-card/80 backdrop-blur-md sticky top-0 z-30 border-b border-gray-200 dark:border-gray-800 px-6 py-4 flex justify-between items-center shadow-sm">
                            <button onClick={() => setMenuOpen(!menuOpen)} className="md:hidden p-2 hover:bg-gray-100 rounded-lg"><Menu size={24} className="text-gray-600"/></button>
                            <h2 className="text-xl font-bold text-gray-800 dark:text-white">{t[view] || t.dashboard}</h2>
                            <div className="flex gap-2 sm:gap-3 items-center relative">
                                <NotificationBell onClick={openNotifications} /> 
                                <div className="relative">
                                    <button onClick={() => setSettingsOpen(!settingsOpen)} className={`p-2 rounded-lg transition-all shadow-sm flex items-center justify-center gap-1.5 ${settingsOpen || reduceMotion || highlightLinks || isReaderActive ? 'bg-primary text-white shadow-primary/20' : 'bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-white hover:bg-gray-200 dark:hover:bg-gray-600'}`} title={isAr ? "إمكانية الوصول" : "Accessibility"}>
                                        <Accessibility size={20} className={settingsOpen ? "scale-110 transition-transform" : "transition-transform"} />
                                    </button>
                                    {settingsOpen && (
                                        <>
                                            <div className="fixed inset-0 z-40" onClick={() => setSettingsOpen(false)}></div>
                                            <div className={`absolute top-full mt-3 ${isAr ? 'left-0' : 'right-0'} w-72 bg-white dark:bg-dark-card rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700 z-50 p-5 animate-fade-in`}>
                                                <h4 className="text-sm font-bold text-gray-800 dark:text-white mb-4 border-b border-gray-100 dark:border-gray-700 pb-3 flex items-center gap-2"><Accessibility size={18} className="text-primary"/>{isAr ? 'إمكانية الوصول' : 'Accessibility'}</h4>
                                                <div className="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
                                                    <div className="flex items-center justify-between"><span className="text-xs font-bold text-gray-600 dark:text-gray-300">{isAr ? 'اللغة' : 'Language'}</span><button onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')} className="px-3 py-1.5 bg-gray-100 dark:bg-gray-800 rounded-lg text-xs font-bold text-gray-800 dark:text-white hover:bg-gray-200 dark:hover:bg-gray-700 transition shadow-sm border border-gray-200 dark:border-gray-600">{lang === 'ar' ? 'English' : 'العربية'}</button></div>
                                                    <div className="flex items-center justify-between"><span className="text-xs font-bold text-gray-600 dark:text-gray-300">{isAr ? 'المظهر' : 'Theme'}</span><button onClick={() => setDarkMode(!darkMode)} className="p-2 bg-gray-100 dark:bg-gray-800 rounded-lg text-yellow-500 hover:bg-gray-200 dark:hover:bg-gray-700 transition shadow-sm border border-gray-200 dark:border-gray-600">{darkMode ? <Sun size={16}/> : <Moon size={16} className="text-gray-600 dark:text-gray-300"/>}</button></div>
                                                    <div className="flex items-center justify-between"><span className="text-xs font-bold text-gray-600 dark:text-gray-300">{isAr ? 'حجم الخط' : 'Font Size'} ({zoomLevel}%)</span><div className="flex gap-1.5"><button onClick={() => setZoomLevel(prev => Math.min(prev + 10, 130))} className="p-1.5 bg-gray-100 dark:bg-gray-800 rounded-lg text-xs font-bold w-8 h-8 flex items-center justify-center text-gray-800 dark:text-white hover:bg-gray-200 dark:hover:bg-gray-700 transition shadow-sm border border-gray-200 dark:border-gray-600">A+</button><button onClick={() => setZoomLevel(prev => Math.max(prev - 10, 80))} className="p-1.5 bg-gray-100 dark:bg-gray-800 rounded-lg text-xs font-bold w-8 h-8 flex items-center justify-center text-gray-800 dark:text-white hover:bg-gray-200 dark:hover:bg-gray-700 transition shadow-sm border border-gray-200 dark:border-gray-600">A-</button></div></div>
                                                    <div className="flex items-center justify-between"><span className="text-xs font-bold text-gray-600 dark:text-gray-300">{isAr ? 'القارئ الصوتي' : 'Screen Reader'}</span><button onClick={toggleSpeech} className={`p-2 rounded-lg transition-all shadow-sm border ${isReaderActive ? 'bg-primary text-white border-primary' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-600 hover:bg-gray-200 dark:hover:bg-gray-700'}`}>{isReaderActive ? <Volume2 size={16} className="animate-pulse"/> : <VolumeX size={16}/>}</button></div>
                                                    <div className="flex items-center justify-between"><span className="text-xs font-bold text-gray-600 dark:text-gray-300">{isAr ? 'تمييز الأزرار والروابط' : 'Highlight Links'}</span><button onClick={() => setHighlightLinks(!highlightLinks)} className={`p-2 rounded-lg transition-all shadow-sm border ${highlightLinks ? 'bg-primary text-white border-primary' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-600 hover:bg-gray-200 dark:hover:bg-gray-700'}`}><MousePointerClick size={16}/></button></div>
                                                    <div className="flex items-center justify-between"><span className="text-xs font-bold text-gray-600 dark:text-gray-300">{isAr ? 'إيقاف الحركات' : 'Reduce Motion'}</span><button onClick={() => setReduceMotion(!reduceMotion)} className={`p-2 rounded-lg transition-all shadow-sm border ${reduceMotion ? 'bg-primary text-white border-primary' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-600 hover:bg-gray-200 dark:hover:bg-gray-700'}`}><Activity size={16}/></button></div>
                                                </div>
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        </header>
                        <div id="main-content" className="p-6 max-w-7xl mx-auto">{renderContent()}</div>
                        <Chatbot t={t} />
                    </main>
                </div>
            );
        };

        const App = () => {
            return (
                <AppProvider>
                    <MainApp />
                </AppProvider>
            )
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
