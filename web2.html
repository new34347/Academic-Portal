            const [isOpen, setIsOpen] = useState(false);

            const messagesEndRef = useRef(null);

                setMessages(prev => [...prev, { id: Date.now(), text: input, sender: 'user' }]);

                                    <p className="text-xs text-gray-500 dark:text-gray-400 mt-1 leading-relaxed">{n.body}</p>
                                </div>
                                {!n.read && <div className="self-center w-2 h-2 rounded-full bg-red-500 shrink-0"></div>}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const StudentDashboardPage = ({ onBack, lang, globalData }) => {
            const isAr = lang === 'ar';
            const { enrolledCourses = [], gpaTrend = [], attendanceStats = [] } = globalData;
            
            const currentHours = enrolledCourses.reduce((sum, c) => sum + c.hours, 0);

            const [hoveredPoint, setHoveredPoint] = useState(null);
            const chartHeight = 220, chartWidth = 800, paddingX = 80, paddingY = 50, maxGPA = 4.0, minGPA = 2.0;

            const points = gpaTrend.map((item, index) => {
                const step = (chartWidth - (paddingX * 2)) / (gpaTrend.length - 1);
                const xPos = chartWidth - paddingX - (index * step); // RTL
                const yPos = chartHeight - paddingY - ((item.gpa - minGPA) / (maxGPA - minGPA)) * (chartHeight - (paddingY * 2));
                return { x: xPos, y: yPos, ...item };
            });

            const linePath = "M" + points.map(p => `${p.x},${p.y}`).join(" L");
            const areaPath = `${linePath} L${points[points.length-1].x},${chartHeight - paddingY} L${points[0].x},${chartHeight - paddingY} Z`;

            return (
                <div className="animate-fade-in space-y-6 pb-10">
                    <HeaderPage title={isAr ? "لوحة معلومات الطالب" : "Student Dashboard"} onBack={onBack} lang={lang} />
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white dark:bg-dark-card rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col items-center justify-center text-center h-48 transition hover:shadow-md"><div className="mb-4 text-primary bg-primary/10 p-4 rounded-full"><BookOpen size={32} strokeWidth={1.5} /></div><h3 className="text-gray-500 font-bold mb-2">{isAr?"المقررات المسجلة":"Registered"}</h3><span className="text-3xl font-bold text-gray-800 dark:text-white">{enrolledCourses.length}</span></div>
                        <div className="bg-white dark:bg-dark-card rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col items-center justify-center text-center h-48 transition hover:shadow-md"><div className="mb-4 text-blue-600 bg-blue-50 p-4 rounded-full"><Layers size={32} strokeWidth={1.5} /></div><h3 className="text-gray-500 font-bold mb-2">{isAr?"الساعات الحالية":"Current Hrs"}</h3><span className="text-3xl font-bold text-gray-800 dark:text-white">{currentHours}</span></div>
                        <div className="bg-white dark:bg-dark-card rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col items-center justify-center text-center h-48 transition hover:shadow-md"><div className="mb-4 text-gold bg-yellow-50 p-4 rounded-full"><Medal size={32} strokeWidth={1.5} /></div><h3 className="text-gray-500 font-bold mb-2">{isAr?"الساعات المكتسبة":"Earned"}</h3><span className="text-3xl font-bold text-gray-800 dark:text-white">{globalData.student.completedHours}</span></div>
                    </div>

                    <div className="bg-white dark:bg-dark-card rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700">
                        <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-bold text-primary dark:text-teal-400">{isAr?"تحليل المعدل التراكمي":"GPA Analysis"}</h3></div>
                        <div className="w-full overflow-hidden relative">
                            <div className={`absolute inset-0 flex items-center justify-center pointer-events-none z-10 transition-all duration-300 ${hoveredPoint ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'}`}>
                                <div className="bg-white/95 dark:bg-dark-card/95 backdrop-blur-md px-6 py-3 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-600 text-center min-w-[140px]"><p className="text-[10px] text-gray-400 font-bold mb-0.5 uppercase tracking-wider">{hoveredPoint?.sem}</p><div className="flex items-baseline justify-center gap-1"><span className="text-3xl font-bold text-primary dark:text-teal-400 font-mono tracking-tighter drop-shadow-sm">{hoveredPoint?.gpa.toFixed(2)}</span><span className="text-[10px] text-gray-400 font-mono">/ 4.00</span></div></div>
                            </div>
                            <div className="w-full h-80 relative select-none">
                                <svg viewBox={`0 0 ${chartWidth} ${chartHeight}`} className="w-full h-full overflow-visible">
                                    <defs><linearGradient id="chartFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stopColor="#006771" stopOpacity="0.3"/><stop offset="100%" stopColor="#006771" stopOpacity="0"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" floodOpacity="0.2"/></filter></defs>
                                    {[2.5, 3.0, 3.5, 4.0].map((val, i) => { const y = chartHeight - paddingY - ((val - minGPA) / (maxGPA - minGPA)) * (chartHeight - (paddingY * 2)); return (<g key={i}><line x1={paddingX} y1={y} x2={chartWidth - paddingX} y2={y} stroke="#e5e7eb" strokeWidth="1" strokeDasharray="4"/><text x={chartWidth - paddingX + 10} y={y + 4} className="text-[10px] fill-gray-400 font-mono">{val.toFixed(1)}</text></g>); })}
                                    <path d={areaPath} fill="url(#chartFill)" /><path d={linePath} fill="none" stroke="#006771" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" filter="url(#shadow)" />
                                    {points.map((p, i) => (<g key={i} onMouseEnter={() => setHoveredPoint(p)} onMouseLeave={() => setHoveredPoint(null)} className="cursor-pointer group"><circle cx={p.x} cy={p.y} r="35" fill="transparent" /><circle cx={p.x} cy={p.y} r={hoveredPoint === p ? 10 : 6} fill={hoveredPoint === p ? "#B18E51" : "white"} stroke="#006771" strokeWidth={hoveredPoint === p ? 0 : 3} className="transition-all duration-300"/><text x={p.x} y={p.y - 15} textAnchor="middle" className={`text-[10px] font-bold fill-gray-500 dark:fill-gray-400 font-mono transition-opacity duration-300 ${hoveredPoint === p ? 'opacity-0' : 'opacity-100'}`}>{p.gpa.toFixed(2)}</text><text x={p.x} y={chartHeight - 5} textAnchor="middle" className={`text-xs font-bold transition-all ${hoveredPoint === p ? 'fill-primary text-base' : 'fill-gray-500 dark:fill-gray-400'}`}>{p.sem}</text></g>))}
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AddDropPage = ({ onBack, lang, globalData }) => {
            const isAr = lang === 'ar';
            const { enrolledCourses = [], availableCourses = [] } = globalData;
            
            const [filterTime, setFilterTime] = useState('');
            const [selectedCourseForAdd, setSelectedCourseForAdd] = useState(null);
            const [confirmationModal, setConfirmationModal] = useState(null); 
            const [message, setMessage] = useState(null);

            const filteredAvailable = availableCourses.filter(course => { if (!filterTime) return true; return course.sections.some(sec => sec.time.includes(filterTime)); });
            
            const handleDropClick = (course) => { setConfirmationModal({ type: 'drop', item: course, title: isAr ? "تأكيد الحذف" : "Confirm Drop", text: `${isAr ? "هل أنت متأكد من حذف" : "Drop"} ${isAr?course.nameAr:course.nameEn}?` }); };
            const handleAddClick = (course) => { setSelectedCourseForAdd(course); };
            const handleSectionSelect = (course, section) => { 
                if (section.status === 'closed') { setMessage({ text: isAr ? "الشعبة مغلقة" : "Section closed", type: 'error' }); setTimeout(() => setMessage(null), 3000); return; } 
                setConfirmationModal({ type: 'add', item: { ...course, ...section, id: Date.now() }, title: isAr ? "تأكيد الإضافة" : "Confirm Add", text: `${isAr ? "هل أنت متأكد من إضافة" : "Add"} ${isAr?course.nameAr:course.nameEn} - شعبة ${section.section}?` }); 
            };
            
            // 🔥 Firebase Action 🔥
            const executeAction = () => { 
                const action = confirmationModal.type; 
                const item = confirmationModal.item; 
                let newEnrolled = [...enrolledCourses];

                if (action === 'drop') { 
                    newEnrolled = newEnrolled.filter(c => c.id !== item.id); 
                    setMessage({ text: isAr ? "تم الحذف بنجاح" : "Dropped successfully", type: 'success' }); 
                } else if (action === 'add') { 
                    newEnrolled.push(item);
                    setSelectedCourseForAdd(null); 
                    setMessage({ text: isAr ? "تم الإضافة بنجاح" : "Added successfully", type: 'success' }); 
                } 
                
                // Write to Firebase Global State
                window.db.ref('bawabaty_portal/enrolledCourses').set(newEnrolled);

                setConfirmationModal(null); 
                setTimeout(() => setMessage(null), 3000); 
            };
            
            return (
                <div className="animate-fade-in space-y-6 relative">
                    <HeaderPage title={isAr?"الحذف والإضافة":"Add/Drop"} onBack={onBack} lang={lang} extra={<div className="flex gap-2"><span className="bg-primary/10 text-primary px-3 py-1 rounded-lg text-xs font-bold">{enrolledCourses.reduce((a, c) => a + c.hours, 0)} {isAr?"ساعات":"Hrs"}</span></div>} />
                    
                    {message && <div className={`fixed top-4 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full shadow-xl text-white font-bold text-sm flex items-center gap-2 z-[60] animate-fade-in ${message.type === 'success' ? 'bg-green-600' : 'bg-red-600'}`}>{message.text}</div>}
                    
                    {confirmationModal && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-fade-in">
                            <div className="bg-white dark:bg-dark-card w-full max-w-sm rounded-2xl shadow-2xl p-6 border border-gray-100 dark:border-gray-700">
                                <div className={`w-12 h-12 rounded-full flex items-center justify-center mb-4 mx-auto ${confirmationModal.type === 'add' ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}`}>{confirmationModal.type === 'add' ? <PlusCircle size={24}/> : <MinusCircle size={24}/>}</div>
                                <h3 className="text-lg font-bold text-center mb-2 text-gray-800 dark:text-white">{confirmationModal.title}</h3><p className="text-sm text-gray-500 text-center mb-6">{confirmationModal.text}</p>
                                <div className="flex gap-3"><button onClick={executeAction} className={`flex-1 py-2.5 rounded-xl text-white font-bold transition ${confirmationModal.type === 'add' ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'}`}>{isAr?"تأكيد":"Confirm"}</button><button onClick={() => setConfirmationModal(null)} className="flex-1 py-2.5 rounded-xl bg-gray-100 text-gray-700 font-bold hover:bg-gray-200">{isAr?"إلغاء":"Cancel"}</button></div>
                            </div>
                        </div>
                    )}

                    {selectedCourseForAdd && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fade-in" onClick={() => setSelectedCourseForAdd(null)}>
                            <div className="bg-white dark:bg-dark-card w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden border border-gray-100 dark:border-gray-700 flex flex-col" onClick={e => e.stopPropagation()}>
                                <div className="p-4 border-b flex justify-between items-center bg-gray-50/80"><div><h3 className="font-bold text-lg text-primary">{isAr?selectedCourseForAdd.nameAr:selectedCourseForAdd.nameEn}</h3></div><button onClick={() => setSelectedCourseForAdd(null)} className="p-2 bg-gray-100 rounded-full hover:bg-gray-200"><X size={18}/></button></div>
                                <div className="overflow-y-auto p-4"><table className="w-full text-sm text-right"><thead className="text-gray-500 font-medium bg-gray-50 rounded-lg"><tr><th className="p-3">الشعبة</th><th className="p-3">الوقت</th><th className="p-3">المحاضر</th><th className="p-3">الحالة</th><th className="p-3"></th></tr></thead><tbody className="divide-y divide-gray-100">{selectedCourseForAdd.sections.map((sec, idx) => (<tr key={idx}><td className="p-3 font-bold font-mono text-primary">{sec.section}</td><td className="p-3 dir-ltr text-right">{sec.time} <br/><span className="text-[10px] text-gray-500">{isAr?sec.daysAr:sec.daysEn}</span></td><td className="p-3">{isAr?sec.profAr:sec.profEn}</td><td className="p-3"><span className={`px-2 py-0.5 rounded text-[10px] font-bold ${sec.status === 'open' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{sec.status}</span></td><td className="p-3 text-left"><button onClick={() => handleSectionSelect(selectedCourseForAdd, sec)} disabled={sec.status === 'closed'} className={`p-2 rounded-lg transition ${sec.status === 'open' ? 'bg-primary text-white hover:bg-teal-700' : 'bg-gray-200 text-gray-400'}`}><PlusCircle size={18}/></button></td></tr>))}</tbody></table></div>
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-1 gap-6">
                        <div className="bg-white dark:bg-dark-card rounded-2xl border shadow-sm p-5">
                            <h3 className="font-bold text-gray-800 dark:text-white mb-4 flex items-center gap-2 border-b pb-3"><FileCheck className="text-green-600" size={20}/> {isAr?"المقررات المسجلة حالياً":"Currently Enrolled"}</h3>
                            <div className="space-y-3">
                                {enrolledCourses.length === 0 ? <p className="text-center text-gray-400 py-4 text-sm">{isAr?"لا يوجد":"Empty"}</p> : enrolledCourses.map(c => (
                                    <div key={c.id} className="flex justify-between items-center p-3 bg-gray-50 dark:bg-gray-800 rounded-xl border border-gray-100 group">
                                        <div><div className="font-bold text-gray-800 dark:text-white flex items-center gap-2">{isAr?c.nameAr:c.nameEn}<span className="text-[10px] px-1.5 py-0.5 bg-gray-200 rounded font-mono text-gray-600">{c.section}</span></div><div className="text-xs text-gray-500 mt-1 flex gap-3 items-center"><span className="font-mono bg-white px-1 rounded border">{c.code}</span><span className="flex items-center gap-1"><User size={10}/> {isAr?c.profAr:c.profEn}</span></div></div>
                                        <button onClick={() => handleDropClick(c)} className="p-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-500 hover:text-white transition"><LogOut size={18} className="rotate-180"/></button>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="bg-white dark:bg-dark-card rounded-2xl border shadow-sm p-5">
                            <div className="flex justify-between items-center mb-4 border-b pb-3"><h3 className="font-bold text-gray-800 dark:text-white flex items-center gap-2"><Layers className="text-primary" size={20}/> {isAr?"المطروحة":"Offered"}</h3></div>
                            <div className="space-y-3">
                                {filteredAvailable.map(c => (
                                    <div key={c.code} className="flex justify-between items-center p-4 bg-white border rounded-xl hover:border-primary transition shadow-sm">
                                        <div><div className="font-bold text-gray-800 dark:text-white">{isAr?c.nameAr:c.nameEn}</div><div className="text-xs text-gray-500 mt-1 flex gap-3"><span className="font-mono bg-gray-100 px-1.5 py-0.5 rounded">{c.code}</span><span>{c.hours} {isAr?"ساعات":"hrs"}</span></div></div>
                                        <button onClick={() => handleAddClick(c)} className="flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-lg text-xs font-bold hover:bg-teal-700 shadow-sm"><PlusCircle size={16}/> {isAr?"إضافة":"Add"}</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SchedulePage = ({ onBack, lang, globalData }) => {
            const isAr = lang === 'ar';
            const { enrolledCourses = [] } = globalData;
            
            const weekDays = isAr ? ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'] : ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday'];
            const timeSlots = [];
            for (let i = 8; i <= 21; i++) {
                const start = i < 10 ? `0${i}` : i;
                const end = i < 10 ? `0${i}` : i;
                timeSlots.push({ hour: i, label: isAr ? `${end}:50 - ${start}:00` : `${start}:00 - ${end}:50` });
            }

            // Derive schedule from enrolledCourses
            const schedule = { 'الأحد': [], 'الاثنين': [], 'الثلاثاء': [], 'الأربعاء': [], 'الخميس': [], 'Sunday':[], 'Monday':[], 'Tuesday':[], 'Wednesday':[], 'Thursday':[] };
            enrolledCourses.forEach(c => {
                if (c.scheduleDays) {
                    c.scheduleDays.forEach(day => {
                        if (schedule[day]) schedule[day].push(c);
                    });
                }
            });

            const [selectedLecture, setSelectedLecture] = useState(null);

            return (
                <div className="animate-fade-in space-y-6 relative h-full">
                    <HeaderPage title={isAr?"الجدول الدراسي":"Schedule"} onBack={onBack} lang={lang} />
                    
                    {selectedLecture && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fade-in" onClick={() => setSelectedLecture(null)}>
                            <div className="bg-white dark:bg-dark-card w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-gray-100 transform transition-all scale-100 flex flex-col" onClick={e => e.stopPropagation()}>
                                <div className={`h-32 ${selectedLecture.color} relative flex flex-col items-center justify-center text-white`}>
                                    <button onClick={() => setSelectedLecture(null)} className="absolute top-4 right-4 bg-black/20 text-white p-2 rounded-full hover:bg-black/40"><X size={20}/></button>
                                    <h3 className="text-2xl font-bold shadow-sm mt-2">{isAr?selectedLecture.nameAr:selectedLecture.nameEn}</h3>
                                    <span className="text-sm font-mono opacity-90 bg-white/20 px-3 py-1 rounded-full mt-2">{selectedLecture.code}</span>
                                </div>
                                <div className="p-6 space-y-4">
                                    <div className="flex items-center gap-4 p-3 bg-gray-50 rounded-xl"><div className="p-3 bg-blue-50 text-blue-600 rounded-full"><Clock size={20}/></div><div><p className="font-bold text-gray-800 dir-ltr">{selectedLecture.time}</p></div></div>
                                    <div className="flex items-center gap-4 p-3 bg-gray-50 rounded-xl"><div className="p-3 bg-purple-50 text-purple-600 rounded-full"><MapPin size={20}/></div><div><p className="font-bold text-gray-800 text-sm">{selectedLecture.room}</p><p className="text-xs text-gray-500 mt-0.5">{selectedLecture.college}</p></div></div>
                                    <div className="flex items-center gap-4 p-3 bg-gray-50 rounded-xl"><div className="p-3 bg-teal-50 text-teal-600 rounded-full"><User size={20}/></div><div><p className="font-bold text-gray-800">{isAr?selectedLecture.profAr:selectedLecture.profEn}</p></div></div>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="bg-white dark:bg-dark-card rounded-lg border border-gray-200 dark:border-gray-700 overflow-x-auto shadow-sm">
                        <table className="w-full min-w-[800px] text-center table-fixed border-collapse">
                            <thead className="bg-white dark:bg-dark-card text-gray-800 dark:text-white border-b border-gray-200 dark:border-gray-700">
                                <tr><th className="py-4 w-28 border-l border-gray-200"></th> {weekDays.map(day => (<th key={day} className="py-4 border-l border-gray-200 text-sm font-bold">{day}</th>))}</tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100 dark:divide-gray-700">
                                {timeSlots.map((slot) => (
                                    <tr key={slot.hour} className="h-24">
                                        <td className="p-2 bg-white text-gray-600 text-xs font-bold border-l font-mono align-top pt-8">{slot.label}</td>
                                        {weekDays.map((day, dayIdx) => {
                                            const lecture = schedule[day]?.find(l => l.start === slot.hour);
                                            const isOccupied = schedule[day]?.some(l => slot.hour > l.start && slot.hour < l.start + l.dur);
                                            if (lecture) {
                                                return (
                                                    <td key={dayIdx} rowSpan={lecture.dur} className="p-1 relative align-top h-full border-l">
                                                        <button onClick={() => setSelectedLecture(lecture)} className={`w-full h-full rounded-lg ${lecture.color} ${lecture.text} flex flex-col items-center justify-center text-center shadow-sm hover:opacity-90 p-2 relative group`}>
                                                            <div className="flex flex-col items-center justify-center h-full w-full gap-1">
                                                                <span className="font-bold text-base leading-tight">{isAr?lecture.nameAr:lecture.nameEn}</span>
                                                                <span className="text-sm opacity-90 font-mono bg-black/10 px-1.5 rounded text-[10px]">{lecture.code}</span>
                                                            </div>
                                                        </button>
                                                    </td>
                                                );
                                            }
                                            if (isOccupied) return null;
                                            return <td key={dayIdx} className="border-l border-gray-100"></td>
                                        })}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const DepartmentRequestPage = ({ onBack, type, lang, globalData }) => {
            const isAr = lang === 'ar';
            const [submitted, setSubmitted] = useState(false);
            const [selectedCourse, setSelectedCourse] = useState('');
            const coursesList = type === 'add' ? globalData.availableCourses : globalData.enrolledCourses;
            
            const submitRequest = () => {
                const newReq = { id: Date.now(), typeKey: type, date: new Date().toISOString().split('T')[0], status: 'pending', course: selectedCourse };
                const currentReqs = globalData.registrationRequests || [];
                window.db.ref('bawabaty_portal/registrationRequests').set([...currentReqs, newReq]);
                setSubmitted(true);
            };

            if(submitted) return (<div className="animate-fade-in text-center py-20"><div className="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6"><Check size={40}/></div><h3 className="text-2xl font-bold mb-6">{isAr?"تم الإرسال":"Submitted"}</h3><button onClick={onBack} className="bg-gray-100 text-gray-700 px-6 py-2 rounded-lg font-bold">{isAr?"عودة":"Back"}</button></div>);

            return (
                <div className="animate-fade-in space-y-6">
                    <HeaderPage title={isAr ? "طلب للقسم" : "Department Request"} onBack={onBack} lang={lang} />
                    <div className="bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                        <label className="block text-sm font-bold text-gray-700 mb-2">{isAr?"اختر المقرر":"Select Course"}</label>
                        <select className="w-full p-3 rounded-lg border bg-gray-50" value={selectedCourse} onChange={(e) => setSelectedCourse(e.target.value)}>
                            <option value="" disabled>-- اختر --</option>
                            {coursesList.map((c, i) => <option key={i} value={c.code}>{isAr ? c.nameAr : c.nameEn}</option>)}
                        </select>
                        <button onClick={submitRequest} disabled={!selectedCourse} className={`w-full font-bold py-3 rounded-xl transition ${!selectedCourse ? 'bg-gray-300 text-gray-500' : 'bg-primary text-white'}`}>{isAr?"إرسال":"Submit"}</button>
                    </div>
                </div>
            );
        };

        const HomeView = ({ t, openService, lang, globalData }) => {
            const isAr = lang === 'ar';
            const { student, enrolledCourses, attendanceStats } = globalData;
            
            const completed = student.completedHours;
            const current = enrolledCourses.reduce((sum, c) => sum + c.hours, 0); 
            const remaining = student.totalHours - (completed + current);
            const total = student.totalHours;
            const completedPct = (completed / total) * 100;
            const currentPct = (current / total) * 100;

            return (
                <div className="space-y-8 animate-fade-in">
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 bg-primary rounded-2xl p-8 text-white shadow-xl relative overflow-hidden group flex flex-col justify-between">
                            <div className="absolute top-0 right-0 w-full h-full opacity-[0.07] bg-[url('https://www.transparenttextures.com/patterns/arabesque.png')]"></div>
                            <div className="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8">
                                <div><div className="inline-flex items-center gap-2 bg-black/20 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-medium text-teal-100 mb-4 border border-white/10"><TrendingUp size={14} className="text-gold" /> <span>{student.status}</span></div><h2 className="text-6xl font-bold text-white mb-2 tracking-tighter">{student.gpa}</h2><p className="text-teal-100 text-lg opacity-90">{t.gpa}</p></div>
                                <div className="bg-white/10 backdrop-blur-md p-4 rounded-xl border border-white/10 text-center min-w-[100px]"><span className="block text-3xl font-bold text-gold">{total}</span><span className="text-xs text-teal-100">{t['total-hours-label']}</span></div>
                            </div>
                            <div className="relative z-10 w-full">
                                <div className="flex justify-between text-xs text-teal-100 mb-2 font-medium"><span>{t.progress}</span><span>{Math.round(((completed + current)/total)*100)}%</span></div>
                                <div className="w-full h-4 bg-black/20 rounded-full overflow-hidden flex"><div className="h-full bg-white shadow-[0_0_10px_rgba(255,255,255,0.5)]" style={{ width: `${completedPct}%` }}></div><div className="h-full bg-gold shadow-[0_0_10px_rgba(177,142,81,0.5)]" style={{ width: `${currentPct}%` }}></div></div>
                                <div className="grid grid-cols-3 gap-2 mt-4">
                                    <div className="bg-white/10 rounded-lg p-2 text-center border border-white/5"><span className="text-[10px] text-teal-100">{t.hoursCompleted}</span><span className="text-lg font-bold text-white block">{completed}</span></div>
                                    <div className="bg-gold/20 rounded-lg p-2 text-center border border-gold/20"><span className="text-[10px] text-gold">{t.hoursCurrent}</span><span className="text-lg font-bold text-gold block">{current}</span></div>
                                    <div className="bg-black/20 rounded-lg p-2 text-center border border-white/5"><span className="text-[10px] text-gray-300">{t.hoursRemaining}</span><span className="text-lg font-bold text-gray-200 block">{remaining}</span></div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white dark:bg-dark-card rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col h-full min-h-[250px]">
                            <div className="p-4 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center"><h3 className="font-bold text-primary flex items-center gap-2 text-sm"><BookOpen size={16}/> موادك الحالية</h3></div>
                            <div className="p-4 space-y-4 flex-1 overflow-y-auto">
                                {enrolledCourses.length === 0 ? <div className="text-center text-gray-400 mt-4 text-sm">لا يوجد مواد مسجلة</div> : enrolledCourses.map((c, i) => (
                                    <div key={i} className="flex gap-4 items-center bg-gray-50 p-2 rounded-lg border">
                                        <div className="bg-teal-50 p-3 rounded-lg border border-teal-100 w-full"><h4 className="font-bold text-primary text-sm">{isAr?c.nameAr:c.nameEn}</h4><p className="text-xs text-gray-600 mt-1">{c.room} • {c.time}</p></div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [activeCategory, setActiveCategory] = useState(null);
            const [darkMode, setDarkMode] = useState(false);
            const [lang, setLang] = useState('ar');
            const [menuOpen, setMenuOpen] = useState(false);
            const [zoomLevel, setZoomLevel] = useState(100);
            
            // 🔥 Firebase State 🔥
            const [globalData, setGlobalData] = useState(null);
            const [isFirebaseLoaded, setIsFirebaseLoaded] = useState(false);

            useEffect(() => {
                const dataRef = window.db.ref('bawabaty_portal');
                dataRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        setGlobalData(data);
                    } else {
                        // Initialize Firebase with our robust mock data structure
                        dataRef.set(defaultFirebaseData);
                        setGlobalData(defaultFirebaseData);
                    }
                    setIsFirebaseLoaded(true);
                });
                return () => dataRef.off();
            }, []);

            useEffect(() => { document.documentElement.classList.toggle('dark', darkMode); }, [darkMode]);
            useEffect(() => { document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; }, [lang]);
            useEffect(() => { document.documentElement.style.fontSize = `${zoomLevel}%`; }, [zoomLevel]);

            if (!isFirebaseLoaded || !globalData) {
                return <div className="flex h-screen items-center justify-center text-primary font-bold text-xl flex-col gap-4"><RefreshCw className="animate-spin" size={40}/> جاري الاتصال والمزامنة مع قاعدة البيانات...</div>;
            }

            const t = translations[lang];
            const isAr = lang === 'ar';
            const goHome = () => setView('home');

            const menuItems = [
                { id: 'academic', icon: <GraduationCap size={20}/>, subItems: [ { id: 'schedule' }, { id: 'student-dashboard' } ] },
                { id: 'registration', icon: <CheckCircle2 size={20}/>, subItems: [ { id: 'addDrop' }, { id: 'dept-add' }, { id: 'dept-drop' } ] },
                { id: 'personal', icon: <User size={20}/>, subItems: [ { id: 'user-account' }, { id: 'notifications' } ] }
            ];

            const renderContent = () => {
                switch(view) {
                    case 'student-dashboard': return <StudentDashboardPage onBack={goHome} lang={lang} globalData={globalData} />; 
                    case 'notifications': return <NotificationsPage onBack={goHome} lang={lang} globalData={globalData} />; 
                    case 'schedule': return <SchedulePage onBack={goHome} t={t} lang={lang} globalData={globalData} />;
                    case 'addDrop': return <AddDropPage onBack={goHome} t={t} lang={lang} globalData={globalData} />;
                    case 'dept-add': return <DepartmentRequestPage onBack={goHome} type="add" lang={lang} globalData={globalData} />;
                    case 'dept-drop': return <DepartmentRequestPage onBack={goHome} type="drop" lang={lang} globalData={globalData} />;
                    case 'user-account': return <div className="p-6 bg-white rounded-xl shadow">بيانات حساب: {globalData.student.name}</div>; // Placeholder
                    default: return <HomeView t={t} openService={setView} lang={lang} globalData={globalData} />;
                }
            };

            return (
                <div className="min-h-screen relative flex">
                    <aside className={`md:flex flex-col w-72 bg-white dark:bg-dark-card border-l fixed top-0 bottom-0 z-40 shadow-sm transition-all duration-300 ${isAr ? 'right-0 border-l' : 'left-0 border-r'} ${menuOpen ? 'translate-x-0' : (isAr ? 'translate-x-full' : '-translate-x-full')} md:translate-x-0`}>
                        <div className="p-8 flex items-center gap-3 mb-2"><div className="w-12 h-12 bg-primary rounded-xl flex items-center justify-center text-white"><GraduationCap size={28}/></div><div><h1 className="font-bold text-xl text-primary">{t.appTitle}</h1></div></div>
                        <nav className="flex-1 px-4 space-y-1 overflow-y-auto">
                            {menuItems.map(cat => (
                                <div key={cat.id}>
                                    <button onClick={() => setActiveCategory(activeCategory === cat.id ? null : cat.id)} className={`w-full flex items-center justify-between px-4 py-3 text-sm font-bold transition-all ${activeCategory === cat.id ? 'bg-gray-50 text-primary' : 'text-gray-600 hover:bg-gray-50'}`}><div className="flex items-center gap-3">{cat.icon} {t[cat.id] || cat.id}</div><ChevronDown size={16} className={`${activeCategory === cat.id ? 'rotate-180' : ''}`}/></button>
                                    <div className={`overflow-hidden transition-all ${activeCategory === cat.id ? 'max-h-96' : 'max-h-0'}`}>
                                        <div className="bg-gray-50 py-2 pr-11 pl-4 space-y-1">
                                            {cat.subItems.map(item => (<button key={item.id} onClick={() => { setView(item.id); setMenuOpen(false); }} className={`w-full text-right text-xs font-bold py-2 px-2 rounded-lg flex items-center gap-2 ${view === item.id ? 'text-primary bg-primary/5' : 'text-gray-500 hover:text-gray-800'}`}><div className={`w-1.5 h-1.5 rounded-full ${view === item.id ? 'bg-primary' : 'bg-gray-300'}`}></div>{t[item.id] || item.id}</button>))}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-gray-100 text-center text-xs text-gray-500 font-bold flex justify-center items-center gap-2">
                            <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div> متصل بقاعدة البيانات
                        </div>
                    </aside>
                    
                    <main className={`flex-1 w-full pb-20 md:pb-10 transition-all duration-300 ${isAr ? 'md:mr-72' : 'md:ml-72'}`}>
                        <header className="bg-white/80 backdrop-blur-md sticky top-0 z-30 border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
                            <button onClick={() => setMenuOpen(!menuOpen)} className="md:hidden p-2 hover:bg-gray-100 rounded-lg"><Menu size={24} className="text-gray-600"/></button>
                            <h2 className="text-xl font-bold text-gray-800">{t[view] || t.dashboard}</h2>
                            <div className="flex gap-2 items-center relative">
                                <NotificationBell onClick={() => setView('notifications')} /> 
                                <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-800 transition shadow-sm">{darkMode ? <Sun size={20}/> : <Moon size={20}/>}</button>
                            </div>
                        </header>
                        <div id="main-content" className="p-6 max-w-7xl mx-auto">{renderContent()}</div>
                        <Chatbot t={t} />
                    </main>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
