            </button>
        );

            // 🔥 Firebase: قراءة المواد المسجلة من الفايربيس
            const enrolled = globalData.enrolledCourses || [];

            const [availableCourses, setAvailableCourses] = useState([

            ]);
            
            const [filterTime, setFilterTime] = useState('');
            const [selectedCourseForAdd, setSelectedCourseForAdd] = useState(null);
            const [confirmationModal, setConfirmationModal] = useState(null); 
            const [message, setMessage] = useState(null);
            const [timeLeft, setTimeLeft] = useState({ days: 2, hours: 14, minutes: 30, seconds: 59 });

            const courseNames = { 'PHYS101': { ar: 'فيزياء عامة', en: 'General Physics' }, 'ISL101': { ar: 'ثقافة إسلامية', en: 'Islamic Culture' }, 'CS204': { ar: 'تراكيب بيانات', en: 'Data Structures' }, 'CS101': { ar: 'مقدمة في البرمجة', en: 'Intro to Programming' }, 'MATH101': { ar: 'تفاضل وتكامل', en: 'Calculus' } };
            const getName = (code) => courseNames[code] ? (isAr ? courseNames[code].ar : courseNames[code].en) : code;

            useEffect(() => {
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev.seconds > 0) return { ...prev, seconds: prev.seconds - 1 };
                        if (prev.minutes > 0) return { ...prev, minutes: prev.minutes - 1, seconds: 59 };
                        if (prev.hours > 0) return { ...prev, hours: prev.hours - 1, minutes: 59, seconds: 59 };
                        if (prev.days > 0) return { ...prev, days: prev.days - 1, hours: 23, minutes: 59, seconds: 59 };
                        return prev; 
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const filteredAvailable = availableCourses.filter(course => { if (!filterTime) return true; return course.sections.some(sec => sec.time.includes(filterTime)); });
            
            const handleDropClick = (course) => { setConfirmationModal({ type: 'drop', item: course, title: isAr ? "تأكيد الحذف" : "Confirm Drop", text: `${isAr ? "هل أنت متأكد من رغبتك في حذف مقرر" : "Are you sure you want to drop"} ${getName(course.code)}?` }); };
            const handleAddClick = (course) => { setSelectedCourseForAdd(course); };
            const handleSectionSelect = (course, section) => { 
                if (section.status === 'closed') { setMessage({ text: isAr ? "عذراً، هذه الشعبة مغلقة" : "Sorry, section is closed", type: 'error' }); setTimeout(() => setMessage(null), 3000); return; }

            };
            
            // 🔥 Firebase: حفظ التعديلات

                const action = confirmationModal.type; 
                const item = confirmationModal.item; 
                let newEnrolled = [...enrolled];

                if (action === 'drop') { 
                    newEnrolled = newEnrolled.filter(c => c.id !== item.id); 
                    setMessage({ text: isAr ? "تم حذف المقرر بنجاح" : "Course dropped", type: 'success' });

                    newEnrolled.push(item);
                    setSelectedCourseForAdd(null); 
                    setMessage({ text: isAr ? "تم إضافة المقرر بنجاح" : "Course added", type: 'success' });

                // تحديث قاعدة البيانات مباشرة

                setConfirmationModal(null);

                        </div>

                    {confirmationModal && (

                                    <div key={c.code} className="flex justify-between items-center p-4 bg-white border border-gray-200 dark:border-gray-700 rounded-xl hover:border-primary transition shadow-sm">
                                        <div><div className="font-bold text-gray-800 dark:text-white text-base">{getName(c.code)}</div><div className="text-xs text-gray-500 mt-1 flex gap-3"><span className="font-mono bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded">{c.code}</span><span>{c.hours} {isAr?"ساعات":"hrs"}</span></div></div>
                                        <button onClick={() => handleAddClick(c)} className="flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-lg text-xs font-bold hover:bg-teal-700 shadow-sm"><PlusCircle size={16}/> {isAr?"إضافة":"Add"}</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const HomeView = ({ t, openService, lang, globalData }) => {
            const isAr = lang === 'ar';
            // 🔥 Firebase: قراءة البيانات الأساسية وحساب الساعات آلياً بناءً على المواد المسجلة
            const studentData = globalData.student || defaultFirebaseData.student;
            const enrolled = globalData.enrolledCourses || [];
            
            const completed = studentData.completedHours;
            // حساب الساعات الحالية من المواد المسجلة فعلياً بالفايربيس
            const current = enrolled.reduce((sum, course) => sum + course.hours, 0); 
            const remaining = studentData.totalHours - (completed + current);
            const total = studentData.totalHours;
            const completedPct = (completed / total) * 100;
            const currentPct = (current / total) * 100;

            return (
                <div className="space-y-8 animate-fade-in">
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 bg-primary rounded-2xl p-8 text-white shadow-xl relative overflow-hidden group flex flex-col justify-between">
                            <div className="absolute top-0 right-0 w-full h-full opacity-[0.07] bg-[url('https://www.transparenttextures.com/patterns/arabesque.png')]"></div>
                            <div className="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8">
                                <div>
                                    <div className="inline-flex items-center gap-2 bg-black/20 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-medium text-teal-100 mb-4 border border-white/10"><TrendingUp size={14} className="text-gold" /> <span>{t.statusRegular}</span></div>
                                    <h2 className="text-6xl font-bold text-white mb-2 tracking-tighter">{studentData.gpa}</h2> 
                                    <p className="text-teal-100 text-lg opacity-90">{studentData.name}</p>
                                </div>
                                <div className="bg-white/10 backdrop-blur-md p-4 rounded-xl border border-white/10 text-center min-w-[100px]"><span className="block text-3xl font-bold text-gold">{total}</span><span className="text-xs text-teal-100">{t['total-hours-label']}</span></div>
                            </div>
                            <div className="relative z-10 w-full">
                                <div className="w-full h-4 bg-black/20 rounded-full overflow-hidden flex"><div className="h-full bg-white shadow-[0_0_10px_rgba(255,255,255,0.5)]" style={{ width: `${completedPct}%` }}></div><div className="h-full bg-gold shadow-[0_0_10px_rgba(177,142,81,0.5)]" style={{ width: `${currentPct}%` }}></div></div>
                                <div className="grid grid-cols-3 gap-2 mt-4">
                                    <div className="bg-white/10 rounded-lg p-2 text-center"><span className="text-[10px] text-teal-100 block">{t.hoursCompleted}</span><span className="text-lg font-bold text-white block">{completed}</span></div>
                                    <div className="bg-gold/20 rounded-lg p-2 text-center"><span className="text-[10px] text-gold block">{t.hoursCurrent}</span><span className="text-lg font-bold text-gold block">{current}</span></div>
                                    <div className="bg-black/20 rounded-lg p-2 text-center"><span className="text-[10px] text-gray-300 block">{t.hoursRemaining}</span><span className="text-lg font-bold text-gray-200 block">{remaining}</span></div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white dark:bg-dark-card rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-5">
                            <h3 className="font-bold text-gray-800 dark:text-white flex items-center gap-2 mb-4 border-b pb-2"><BookOpen size={20} className="text-primary"/> موادك الحالية ({enrolled.length})</h3>
                            <div className="space-y-2">
                                {enrolled.length === 0 ? <p className="text-sm text-gray-500">لا يوجد مواد</p> : enrolled.map(c => (
                                    <div key={c.id} className="p-3 bg-gray-50 dark:bg-gray-800 rounded-lg border border-gray-100">
                                        <h4 className="font-bold text-sm text-gray-800 dark:text-white">{c.name || (isAr?c.profAr:c.profEn) || c.code}</h4>
                                        <p className="text-xs text-gray-500 mt-1">{c.code} • {c.hours} {isAr?"ساعات":"hrs"}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [lang, setLang] = useState('ar');
            const [menuOpen, setMenuOpen] = useState(false);
            
            // 🔥 Firebase: حالة النظام والبيانات
            const [isFirebaseLoaded, setIsFirebaseLoaded] = useState(false);
            const [globalData, setGlobalData] = useState(defaultFirebaseData);

            useEffect(() => {
                const dataRef = db.ref('bawabaty');
                
                // مراقب حيّ لأي تغيير في الفايربيس (Realtime Listener)
                dataRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        setGlobalData(data); // تحديث الموقع بالبيانات اللي في الفايربيس
                    } else {
                        // إذا كانت الفايربيس فاضية، نرفع لها البيانات الأساسية
                        dataRef.set(defaultFirebaseData);
                        setGlobalData(defaultFirebaseData);
                    }
                    setIsFirebaseLoaded(true);
                });

                return () => dataRef.off(); // إيقاف المراقب عند الخروج
            }, []);

            useEffect(() => { document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; }, [lang]);

            if (!isFirebaseLoaded) {
                return <div className="flex h-screen items-center justify-center text-primary font-bold text-xl flex-col gap-4"><RefreshCw className="animate-spin" size={40}/> جاري الاتصال بقاعدة البيانات...</div>;
            }

            const t = translations[lang];
            const isAr = lang === 'ar';
            const goHome = () => setView('home');

            const renderContent = () => {
                switch(view) {
                    case 'addDrop': return <AddDropPage onBack={goHome} lang={lang} globalData={globalData} />;
                    default: return <HomeView t={t} openService={setView} lang={lang} globalData={globalData} />;
                }
            };

            return (
                <div className="min-h-screen relative flex">
                    {/* Sidebar */}
                    <aside className={`md:flex flex-col w-72 bg-white dark:bg-dark-card border-l dark:border-l-0 dark:border-r border-gray-200 dark:border-gray-800 fixed top-0 bottom-0 z-40 shadow-sm transition-all duration-300 ${isAr ? 'right-0 border-l' : 'left-0 border-r'} ${menuOpen ? 'translate-x-0' : (isAr ? 'translate-x-full' : '-translate-x-full')} md:translate-x-0`}>
                        <div className="p-8 flex items-center gap-3 mb-2">
                            <div className="w-12 h-12 bg-primary rounded-xl flex items-center justify-center text-white"><GraduationCap size={28}/></div>
                            <div><h1 className="font-bold text-xl text-primary">{t.appTitle}</h1></div>
                        </div>
                        <div className="px-4 space-y-2">
                             <button onClick={() => setView('home')} className={`w-full flex items-center gap-4 px-4 py-3 rounded-lg text-sm font-bold transition-all ${view === 'home' ? 'bg-primary text-white shadow-md' : 'text-gray-600 hover:bg-gray-50'}`}><LayoutDashboard size={20}/> {t.dashboard}</button>
                             <button onClick={() => setView('addDrop')} className={`w-full flex items-center gap-4 px-4 py-3 rounded-lg text-sm font-bold transition-all ${view === 'addDrop' ? 'bg-primary text-white shadow-md' : 'text-gray-600 hover:bg-gray-50'}`}><RefreshCw size={20}/> {t.addDrop}</button>
                        </div>
                    </aside>
                    
                    <main className={`flex-1 w-full pb-20 md:pb-10 transition-all duration-300 ${isAr ? 'md:mr-72' : 'md:ml-72'}`}>
                        <header className="bg-white/80 dark:bg-dark-card/80 backdrop-blur-md sticky top-0 z-30 border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
                            <button onClick={() => setMenuOpen(!menuOpen)} className="md:hidden p-2"><Menu size={24}/></button>
                            <h2 className="text-xl font-bold text-gray-800">{t[view] || t.dashboard}</h2>
                            <div className="text-sm font-bold text-green-600 flex items-center gap-2"><div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div> متصل بقاعدة البيانات</div>
                        </header>
                        <div id="main-content" className="p-6 max-w-5xl mx-auto">{renderContent()}</div>
                    </main>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
