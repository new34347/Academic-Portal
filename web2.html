        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            LayoutDashboard, GraduationCap, CheckCircle2, FileText, User, 
            Bell, Menu, Search, LogOut, ArrowRight, Clock, MapPin,

        } from 'lucide-react';

        // --- FIREBASE REALTIME DATABASE SETUP ---
        const DB_BASE_URL = "https://yahya-b3b2c-default-rtdb.firebaseio.com";

        // Custom Hook to Fetch and Sync Data with Firebase seamlessly
        const useFirebaseData = (path, defaultData) => {
            const [data, setData] = useState(defaultData);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                let isMounted = true;
                const fetchData = async () => {
                    try {
                        const response = await fetch(`${DB_BASE_URL}/${path}.json`);
                        const result = await response.json();
                        
                        if (result !== null && isMounted) {
                            setData(result);
                        } else if (result === null && isMounted) {
                            // Seed empty database with default data
                            fetch(`${DB_BASE_URL}/${path}.json`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(defaultData)
                            });
                        }
                    } catch (error) {
                        console.error(`Firebase DB Error for ${path}:`, error);
                    } finally {
                        if (isMounted) setLoading(false);
                    }
                };
                fetchData();
                return () => { isMounted = false; };
            }, [path]);

            const updateData = (newData) => {
                setData(newData); // Optimistic UI update
                fetch(`${DB_BASE_URL}/${path}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newData)
                }).catch(err => console.error(`Firebase Update Error for ${path}:`, err));
            };

            return [data, updateData, loading];
        };

        // --- Helper Components ---
        const HeaderPage = ({ title, onBack, extra, lang }) => {
            const isAr = lang === 'ar';
            return (
                <div className="flex items-center justify-between mb-6 animate-fade-in sticky top-0 bg-gray-50/95 dark:bg-dark-bg/95 z-20 py-3 backdrop-blur-sm border-b border-transparent">
                    <div className="flex items-center gap-3">

                    </div>
                    <div className="flex gap-2">{extra}</div>
                </div>
            );
        };

        const ActionCard = ({ icon, title, onClick, color = "primary" }) => (
            <button onClick={onClick} className="group relative flex flex-col items-center justify-center bg-white dark:bg-dark-card p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 hover:border-primary dark:hover:border-primary hover:shadow-md transition-all duration-300 h-28 w-full overflow-hidden">

                    {icon}

                <span className="text-xs font-bold text-gray-600 dark:text-gray-300 group-hover:text-primary dark:group-hover:text-teal-400 text-center">{title}</span>
            </button>
        );

        const Chatbot = ({ t }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState([
                { id: 1, text: "مرحباً بك يا فيصل! أنا سند، مساعدك الأكاديمي. كيف يمكنني خدمتك اليوم؟", sender: 'bot' }
            ]);
            const [input, setInput] = useState("");
            const messagesEndRef = useRef(null);

            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages, isOpen]);

            const handleSend = () => {
                if (!input.trim()) return;
                setMessages(prev => [...prev, { id: Date.now(), text: input, sender: 'user' }]);
                setInput("");
                setTimeout(() => {
                    const responses = ["يمكنني مساعدتك في استعراض جدولك الدراسي أو متابعة طلباتك.", "هل تود الاستفسار عن مواعيد الحذف والإضافة؟", "يمكنك الوصول للخدمات الأكاديمية من القائمة الجانبية.", "جاري التحقق من سجلك الأكاديمي..."];
                    setMessages(prev => [...prev, { id: Date.now() + 1, text: responses[Math.floor(Math.random() * responses.length)], sender: 'bot' }]);
                }, 1000);
            };

            return (
                <>
                    <button onClick={() => setIsOpen(!isOpen)} className={`fixed bottom-6 left-6 z-50 p-4 rounded-full shadow-lg transition-all duration-300 hover:scale-110 ${isOpen ? 'bg-red-500 rotate-90' : 'bg-primary animate-bounce'} text-white border-4 border-white dark:border-dark-bg`}>
                        {isOpen ? <X size={24}/> : <MessageCircle size={28}/>}
                    </button>
                    {isOpen && (
                        <div className="fixed bottom-24 left-6 z-40 w-[90vw] md:w-96 bg-white dark:bg-dark-card rounded-3xl shadow-2xl border border-gray-200 dark:border-gray-700 overflow-hidden flex flex-col chat-enter h-[500px] max-h-[70vh]">
                            <div className="bg-gradient-to-r from-primary to-teal-800 p-4 flex items-center gap-3 shadow-md">
                                <div className="p-2 bg-white/20 rounded-full text-white backdrop-blur-sm shadow-inner"><User size={20}/></div>
                                <div><h3 className="font-bold text-white text-base">{t.chatbotTitle}</h3><span className="flex items-center gap-1.5 text-[10px] text-teal-100 font-medium"><div className="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div> متصل الآن</span></div>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50 dark:bg-gray-800/30">
                                {messages.map(msg => (
                                    <div key={msg.id} className={`flex ${msg.sender === 'user' ? 'justify-start' : 'justify-end'} animate-fade-in`}>
                                        <div className={`max-w-[80%] p-3.5 rounded-2xl text-sm leading-relaxed shadow-sm ${msg.sender === 'user' ? 'bg-primary text-white rounded-br-none' : 'bg-white dark:bg-gray-700 text-gray-800 dark:text-white rounded-bl-none border border-gray-100 dark:border-gray-600'}`}>{msg.text}</div>
                                    </div>
                                ))}
                                <div ref={messagesEndRef} />
                            </div>
                            <div className="p-3 bg-white dark:bg-dark-card border-t border-gray-100 dark:border-gray-700 flex gap-2 items-center">
                                <input type="text" value={input} onChange={e => setInput(e.target.value)} onKeyPress={e => e.key === 'Enter' && handleSend()} placeholder={t.typeMessage} className="flex-1 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all dark:text-white"/>
                                <button onClick={handleSend} disabled={!input.trim()} className="p-3 bg-primary text-white rounded-2xl hover:bg-teal-700 disabled:opacity-50 disabled:cursor-not-allowed transition shadow-sm active:scale-95"><Send size={18} className="rotate-180"/></button>

        };

        const Toast = ({ message, type, onClose }) => (
            <div className={`fixed bottom-4 left-4 z-50 flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg text-white font-bold text-sm animate-fade-in ${type === 'success' ? 'bg-emerald-600' : 'bg-red-600'}`}>

        const NotificationBell = ({ onClick }) => (

        // --- Pages mapped to Firebase ---

        const NotificationsPage = ({ onBack, lang }) => {
            const isAr = lang === 'ar';
            const t = { title: isAr ? "التنبيهات" : "Notifications", markRead: isAr ? "تحديد الكل كمقروء" : "Mark all as read", now: isAr ? "الآن" : "Now", minAgo: isAr ? "د" : "m", hourAgo: isAr ? "س" : "h", dayAgo: isAr ? "يوم" : "d" };
            
            const defaultNotifications = [
                { id: 1, type: 'alert', titleAr: "تنبيه هام: درجة غير مرصودة", titleEn: "Important: Unrecorded Grade", bodyAr: "لم يتم رصد درجة مقرر (نظم تشغيل) للفصل السابق.", bodyEn: "Grade for OS course not recorded.", timeAr: t.now, timeEn: t.now, read: false },

        const StudentDashboardPage = ({ onBack, lang }) => {
            const isAr = lang === 'ar';
            const t = { title: isAr ? "لوحة معلومات الطالب" : "Student Dashboard", registered: isAr ? "المقررات المسجلة" : "Registered Courses", remaining: isAr ? "المقررات المتبقية" : "Remaining Courses", earned: isAr ? "الساعات المكتسبة" : "Earned Hours", gpaAnalysis: isAr ? "تحليل المعدل التراكمي" : "GPA Analysis", semGPA: isAr ? "المعدل الفصلي" : "Semester GPA", attStats: isAr ? "إحصائيات الحضور والغياب" : "Attendance Statistics", attDesc: isAr ? "توضيح لنسب الحضور ومقدار الغياب" : "Attendance percentages and absences", safe: isAr ? "آمن" : "Safe", warning: isAr ? "تنبيه" : "Warning", denial: isAr ? "حرمان" : "Denial", absence: isAr ? "غياب" : "Absence", hours: isAr ? "ساعات" : "Hrs" };

            const defaultGpaData = [
                { semAr: 'المستوى 1', semEn: 'Level 1', gpa: 3.85 }, { semAr: 'المستوى 2', semEn: 'Level 2', gpa: 3.60 },
                { semAr: 'المستوى 3', semEn: 'Level 3', gpa: 3.45 }, { semAr: 'المستوى 4', semEn: 'Level 4', gpa: 3.35 }
            ];
            const defaultAttendanceStats = [
                { code: 'SE301', nameAr: 'هندسة برمجيات', nameEn: 'Software Engineering', pct: 98, absent: 1, total: 45 },
                { code: 'CS305', nameAr: 'نظم تشغيل', nameEn: 'Operating Systems', pct: 91, absent: 4, total: 45 },
                { code: 'MATH201', nameAr: 'إحصاء هندسي', nameEn: 'Engineering Statistics', pct: 85, absent: 6, total: 40 },
                { code: 'PHYS101', nameAr: 'فيزياء عامة', nameEn: 'General Physics', pct: 75, absent: 12, total: 48 }
            ];

            const [gpaData] = useFirebaseData('dashboardGpaData', defaultGpaData);
            const [attendanceStats] = useFirebaseData('dashboardAttendanceStats', defaultAttendanceStats);
            const [student] = useFirebaseData('studentInfo', defaultStudentData);

            const [hoveredPoint, setHoveredPoint] = useState(null);
            const chartHeight = 220, chartWidth = 800, paddingX = 80, paddingY = 50, maxGPA = 4.0, minGPA = 2.0;

            const safeGpaData = gpaData || defaultGpaData;
            const points = safeGpaData.map((item, index) => {
                const step = (chartWidth - (paddingX * 2)) / (safeGpaData.length - 1);
                const xPos = chartWidth - paddingX - (index * step);
                const yPos = chartHeight - paddingY - ((item.gpa - minGPA) / (maxGPA - minGPA)) * (chartHeight - (paddingY * 2));
                return { x: xPos, y: yPos, ...item };
            });

            const linePath = "M" + points.map(p => `${p.x},${p.y}`).join(" L");
            const areaPath = `${linePath} L${points[points.length-1].x},${chartHeight - paddingY} L${points[0].x},${chartHeight - paddingY} Z`;

            return (
                <div className="animate-fade-in space-y-6 pb-10">
                    <HeaderPage title={t.title} onBack={onBack} lang={lang} />
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white dark:bg-dark-card rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col items-center justify-center text-center h-48"><div className="mb-4 text-primary bg-primary/10 p-4 rounded-full"><BookOpen size={32} /></div><h3 className="text-gray-500 font-bold mb-2">{t.registered}</h3><span className="text-3xl font-bold text-gray-800 dark:text-white">6</span></div>
                        <div className="bg-white dark:bg-dark-card rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col items-center justify-center text-center h-48"><div className="mb-4 text-blue-600 bg-blue-50 p-4 rounded-full"><Layers size={32} /></div><h3 className="text-gray-500 font-bold mb-2">{t.remaining}</h3><span className="text-3xl font-bold text-gray-800 dark:text-white">{student?.totalHours - (student?.completedHours + student?.currentHours) || 42}</span></div>
                        <div className="bg-white dark:bg-dark-card rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col items-center justify-center text-center h-48"><div className="mb-4 text-gold bg-yellow-50 p-4 rounded-full"><Medal size={32} /></div><h3 className="text-gray-500 font-bold mb-2">{t.earned}</h3><span className="text-3xl font-bold text-gray-800 dark:text-white">{student?.completedHours || 60}</span></div>
                    </div>

                    <div className="bg-white dark:bg-dark-card rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700">
                        <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-bold text-primary dark:text-teal-400">{t.gpaAnalysis}</h3><div className="flex gap-2"><span className="text-xs font-bold text-gray-400 flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-primary"></div> {t.semGPA}</span></div></div>
                        <div className="w-full overflow-hidden relative">
                            <div className={`absolute inset-0 flex items-center justify-center pointer-events-none z-10 transition-all duration-300 ${hoveredPoint ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'}`}><div className="bg-white/95 dark:bg-dark-card/95 backdrop-blur-md px-6 py-3 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-600 text-center min-w-[140px]"><p className="text-[10px] text-gray-400 font-bold mb-0.5 uppercase tracking-wider">{isAr ? hoveredPoint?.semAr : hoveredPoint?.semEn}</p><div className="flex items-baseline justify-center gap-1"><span className="text-3xl font-bold text-primary dark:text-teal-400 font-mono tracking-tighter drop-shadow-sm">{hoveredPoint?.gpa.toFixed(2)}</span><span className="text-[10px] text-gray-400 font-mono">/ 4.00</span></div></div></div>
                            <div className="w-full h-80 relative select-none">
                                <svg viewBox={`0 0 ${chartWidth} ${chartHeight}`} className="w-full h-full overflow-visible">
                                    <defs><linearGradient id="chartFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stopColor="#006771" stopOpacity="0.3"/><stop offset="100%" stopColor="#006771" stopOpacity="0"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" floodOpacity="0.2"/></filter></defs>
                                    {[2.5, 3.0, 3.5, 4.0].map((val, i) => { const y = chartHeight - paddingY - ((val - minGPA) / (maxGPA - minGPA)) * (chartHeight - (paddingY * 2)); return (<g key={i}><line x1={paddingX} y1={y} x2={chartWidth - paddingX} y2={y} stroke="#e5e7eb" strokeWidth="1" strokeDasharray="4"/><text x={chartWidth - paddingX + 10} y={y + 4} className="text-[10px] fill-gray-400 font-mono">{val.toFixed(1)}</text></g>); })}
                                    <path d={areaPath} fill="url(#chartFill)" /><path d={linePath} fill="none" stroke="#006771" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" filter="url(#shadow)" />
                                    {points.map((p, i) => (<g key={i} onMouseEnter={() => setHoveredPoint(p)} onMouseLeave={() => setHoveredPoint(null)} className="cursor-pointer group"><circle cx={p.x} cy={p.y} r="35" fill="transparent" /><circle cx={p.x} cy={p.y} r={hoveredPoint === p ? 10 : 6} fill={hoveredPoint === p ? "#B18E51" : "white"} stroke="#006771" strokeWidth={hoveredPoint === p ? 0 : 3} className="transition-all duration-300"/><text x={p.x} y={p.y - 15} textAnchor="middle" className={`text-[10px] font-bold fill-gray-500 dark:fill-gray-400 font-mono transition-opacity duration-300 ${hoveredPoint === p ? 'opacity-0' : 'opacity-100'}`}>{p.gpa.toFixed(2)}</text><text x={p.x} y={chartHeight - 5} textAnchor="middle" className={`text-xs font-bold transition-all ${hoveredPoint === p ? 'fill-primary text-base' : 'fill-gray-500 dark:fill-gray-400'}`}>{isAr ? p.semAr : p.semEn}</text></g>))}
                                </svg>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-dark-card rounded-2xl p-8 shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4"><div><h3 className="text-xl font-bold text-gray-800 dark:text-white flex items-center gap-2"><FileCheck size={24} className="text-primary" /> {t.attStats}</h3><p className="text-xs text-gray-500 mt-1">{t.attDesc}</p></div><div className="flex flex-wrap gap-3 text-[10px] font-bold bg-gray-50 dark:bg-gray-800/50 p-2 rounded-lg border border-gray-100 dark:border-gray-700"><div className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 rounded bg-emerald-500"></div> {t.safe} (&lt;5%)</div><div className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 rounded bg-amber-400"></div> {t.warning} (5-14%)</div><div className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 rounded bg-red-500"></div> {t.denial} (&ge;15%)</div></div></div>
                        <div className="relative w-full h-[400px]">
                            <div className="absolute inset-0 flex items-end justify-around px-2 pb-6 pt-12 z-10">
                                {attendanceStats?.map((item, i) => {
                                    const absencePct = Math.round((item.absent / item.total) * 100);
                                    const attendancePct = 100 - absencePct;
                                    let barColor = 'bg-emerald-500', lightColor = 'bg-emerald-50 dark:bg-emerald-900/10', textColor = 'text-emerald-600 dark:text-emerald-400';
                                    if(absencePct >= 15) { barColor = 'bg-red-500'; lightColor = 'bg-red-50 dark:bg-red-900/10'; textColor = 'text-red-600 dark:text-red-400'; } else if (absencePct >= 5) { barColor = 'bg-amber-400'; lightColor = 'bg-amber-50 dark:bg-amber-900/10'; textColor = 'text-amber-600 dark:text-amber-400'; }
                                    return (
                                        <div key={i} className="relative flex flex-col items-center justify-end h-full w-full max-w-[80px] group cursor-pointer">
                                            <div className={`mb-3 px-3 py-1 rounded-lg text-sm font-bold shadow-sm transition-all transform group-hover:-translate-y-2 ${lightColor} ${textColor}`}>{absencePct}% <span className="text-[10px] opacity-70 font-normal">{t.absence}</span></div>
                                            <div className="w-12 md:w-16 bg-gray-100 dark:bg-gray-800 rounded-t-lg relative overflow-hidden h-full flex items-end shadow-inner"><div className={`w-full ${barColor} rounded-t-lg transition-all duration-1000 relative`} style={{ height: `${attendancePct}%` }}><div className="absolute inset-0 bg-gradient-to-b from-white/20 to-transparent"></div></div></div>
                                            <div className="mt-3 text-xs md:text-sm font-bold text-gray-800 dark:text-white text-center w-full leading-tight px-0.5 min-h-[2.5rem] flex items-start justify-center" title={isAr ? item.nameAr : item.nameEn}><span className="line-clamp-2">{isAr ? item.nameAr : item.nameEn}</span></div>
                                            <div className="text-[10px] text-gray-500 dark:text-gray-400 font-mono mt-0.5">-{item.absent} {t.hours}</div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AcademicEventsPage = ({ onBack, lang }) => {
            const isAr = lang === 'ar';
            const [now, setNow] = useState(new Date());
            useEffect(() => { const timer = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(timer); }, []);

            const t = { title: isAr ? "الأحداث الأكاديمية" : "Academic Events", assignment: isAr ? "واجب" : "Assignment", project: isAr ? "مشروع" : "Project", exam: isAr ? "اختبار" : "Exam", remaining: isAr ? "الوقت المتبقي" : "Time Remaining", days: isAr ? "يوم" : "d", hours: isAr ? "س" : "h", min: isAr ? "د" : "m", sec: isAr ? "ث" : "s", completed: isAr ? "منتهى" : "Completed", due: isAr ? "موعد التسليم" : "Due Date" };

            const defaultEvents = [
                { id: 1, type: 'assignment', course: 'CS101', titleAr: 'واجب 1: الخوارزميات', titleEn: 'HW 1: Algorithms', dueDateStr: new Date(Date.now() + 86400000 * 2 + 3600000 * 5).toISOString() }, 
                { id: 2, type: 'project', course: 'CS204', titleAr: 'مشروع الخوارزميات', titleEn: 'Algorithms Project', dueDateStr: new Date(Date.now() + 86400000 * 14).toISOString() }, 
                { id: 3, type: 'exam', course: 'MATH201', titleAr: 'الاختبار النصفي', titleEn: 'Midterm Exam', dueDateStr: new Date(Date.now() + 86400000 * 5 + 3600000 * 2).toISOString() }
            ];

            const [events] = useFirebaseData('academicEvents', defaultEvents);

            const getTimeRemaining = (dueDateStr) => {
                const total = Date.parse(dueDateStr) - Date.parse(now);
                if (total <= 0) return null;
                return { 
                    seconds: Math.floor((total / 1000) % 60), 
                    minutes: Math.floor((total / 1000 / 60) % 60), 
                    hours: Math.floor((total / (1000 * 60 * 60)) % 24), 
                    days: Math.floor(total / (1000 * 60 * 60 * 24)) 
                };
            };

            const getTypeStyle = (type) => {
                switch(type) {
                    case 'exam': return { bg: 'bg-red-50 dark:bg-red-900/10', text: 'text-red-600 dark:text-red-400', border: 'border-red-100 dark:border-red-800' };
                    case 'project': return { bg: 'bg-purple-50 dark:bg-purple-900/10', text: 'text-purple-600 dark:text-purple-400', border: 'border-purple-100 dark:border-purple-800' };
                    default: return { bg: 'bg-blue-50 dark:bg-blue-900/10', text: 'text-blue-600 dark:text-blue-400', border: 'border-blue-100 dark:border-blue-800' };
                }
            };

            return (
                <div className="animate-fade-in space-y-6">
                    <HeaderPage title={t.title} onBack={onBack} lang={lang} />
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {events?.map(event => {
                            const remaining = getTimeRemaining(event.dueDateStr);
                            const style = getTypeStyle(event.type);
                            return (
                                <div key={event.id} className="bg-white dark:bg-dark-card rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm flex flex-col hover:shadow-md transition-all duration-300 overflow-hidden">
                                    <div className={`p-4 border-b ${style.border} ${style.bg}`}><div className="flex justify-between items-start"><span className={`px-2 py-1 rounded-lg text-xs font-bold bg-white/50 dark:bg-black/20 ${style.text}`}>{t[event.type]}</span><span className="text-xs font-mono font-bold text-gray-500 bg-white/50 dark:bg-black/20 px-2 py-1 rounded">{event.course}</span></div><h3 className="font-bold text-lg text-gray-800 dark:text-white mt-2 leading-tight">{isAr ? event.titleAr : event.titleEn}</h3></div>
                                    <div className="p-5 flex-1 flex flex-col justify-between gap-4"><div><p className="text-xs text-gray-400 font-bold uppercase tracking-wider mb-1">{t.due}</p><div className="text-sm font-medium text-gray-600 dark:text-gray-300 flex items-center gap-2"><Calendar size={16} className="text-primary"/><span className="dir-ltr">{new Date(event.dueDateStr).toLocaleDateString()}</span></div></div><div className="bg-gray-50 dark:bg-gray-800/50 rounded-xl p-3 border border-gray-100 dark:border-gray-700"><p className="text-[10px] text-gray-400 font-bold mb-2 text-center">{t.remaining}</p>{remaining ? (<div className="flex gap-2 justify-center items-center font-mono text-gray-700 dark:text-gray-200 dir-ltr"><div className="text-center"><span className="text-xl font-bold block leading-none">{remaining.days}</span><span className="text-[9px] text-gray-400">{t.days}</span></div><span className="text-gray-300 mb-3">:</span><div className="text-center"><span className="text-xl font-bold block leading-none">{remaining.hours}</span><span className="text-[9px] text-gray-400">{t.hours}</span></div><span className="text-gray-300 mb-3">:</span><div className="text-center"><span className="text-xl font-bold block leading-none">{remaining.minutes}</span><span className="text-[9px] text-gray-400">{t.min}</span></div><span className="text-gray-300 mb-3">:</span><div className="text-center"><span className="text-xl font-bold block leading-none text-primary">{remaining.seconds}</span><span className="text-[9px] text-gray-400">{t.sec}</span></div></div>) : (<div className="text-center text-red-500 font-bold flex items-center justify-center gap-2"><Clock size={16}/> {t.completed}</div>)}</div></div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const SchedulePage = ({ onBack, t, lang }) => {
            const isAr = lang === 'ar';
            const weekDays = ['day0', 'day1', 'day2', 'day3', 'day4'];
            const displayDays = isAr ? { day0: 'الأحد', day1: 'الاثنين', day2: 'الثلاثاء', day3: 'الأربعاء', day4: 'الخميس' } : { day0: 'Sunday', day1: 'Monday', day2: 'Tuesday', day3: 'Wednesday', day4: 'Thursday' };
            
            const timeSlots = [];
            for (let i = 8; i <= 21; i++) {
                const start = i < 10 ? `0${i}` : i;
                const end = i < 10 ? `0${i}` : i;
                timeSlots.push({ hour: i, label: isAr ? `${end}:50 - ${start}:00` : `${start}:00 - ${end}:50` });
            }

            const defaultSchedule = {
                day0: [ { id: 1, nameAr: 'إحصاء هندسي', nameEn: 'Eng. Statistics', code: 'MATH101', start: 8, dur: 2, color: 'bg-[#56AB7C]', text: 'text-white', room: '101', profAr: 'د. أحمد', profEn: 'Dr. Ahmed', type: 'lec', mode: 'in-person', bldgAr: 'مبنى أ', bldgEn: 'Bldg A', collegeAr: 'الجامعية', collegeEn: 'College' } ],
                day1: [ { id: 3, nameAr: 'تحليل كيميائي', nameEn: 'Chem Analysis', code: 'CH202', start: 10, dur: 2, color: 'bg-[#4F46E5]', text: 'text-white', room: 'Lab 3', profAr: 'أ. محمد', profEn: 'Mr. Mohamed', type: 'lab', mode: 'in-person', bldgAr: 'مبنى المعامل', bldgEn: 'Labs Bldg', collegeAr: 'العلوم', collegeEn: 'Sciences' } ],
                day2: [ { id: 5, nameAr: 'تصميم واجهات', nameEn: 'UI Design', code: 'CS305', start: 16, dur: 2, color: 'bg-[#0082C0]', text: 'text-white', room: '205', profAr: 'د. عمر', profEn: 'Dr. Omar', type: 'lec', mode: 'in-person', bldgAr: 'الحاسب', bldgEn: 'CS Bldg', collegeAr: 'الحاسب', collegeEn: 'CS' } ],
                day3: [],
                day4: []
            };

            const [schedule] = useFirebaseData('schedule', defaultSchedule);
            const [selectedLecture, setSelectedLecture] = useState(null);
            
            const formatTimeRange = (start, dur) => {
                const endHour = start + dur - 1;
                return isAr ? `${endHour < 10 ? `0${endHour}` : endHour}:50 - ${start < 10 ? `0${start}` : start}:00` : `${start < 10 ? `0${start}` : start}:00 - ${endHour < 10 ? `0${endHour}` : endHour}:50`;
            };

            return (
                <div className="animate-fade-in space-y-6 relative h-full">
                    <HeaderPage title={t.schedule} onBack={onBack} lang={lang} extra={<button className="hidden md:flex items-center gap-2 bg-primary text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-teal-700 transition"><Printer size={16}/> {t.print}</button>} />
                    
                    {selectedLecture && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fade-in" onClick={() => setSelectedLecture(null)}>
                            <div className="bg-white dark:bg-dark-card w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-gray-100 dark:border-gray-700 transform transition-all scale-100 flex flex-col" onClick={e => e.stopPropagation()}>
                                <div className={`h-32 ${selectedLecture.color} relative flex flex-col items-center justify-center text-white`}><button onClick={() => setSelectedLecture(null)} className="absolute top-4 right-4 bg-black/20 text-white p-2 rounded-full hover:bg-black/40 transition z-10"><X size={20}/></button><h3 className="text-2xl font-bold shadow-sm mt-2 relative z-10">{isAr ? selectedLecture.nameAr : selectedLecture.nameEn}</h3><span className="text-sm font-mono opacity-90 bg-white/20 px-3 py-1 rounded-full mt-2 relative z-10 backdrop-blur-sm">{selectedLecture.code}</span></div>
                                <div className="p-6 space-y-4">
                                    <div className="flex items-center gap-4 p-3"><div className="p-3 bg-blue-50 text-blue-600 rounded-full"><Clock size={20}/></div><div><p className="font-bold text-gray-800 dark:text-white dir-ltr">{formatTimeRange(selectedLecture.start, selectedLecture.dur)}</p></div></div>
                                    <div className="flex items-center gap-4 p-3"><div className="p-3 bg-purple-50 text-purple-600 rounded-full"><MapPin size={20}/></div><div><p className="font-bold text-gray-800 dark:text-white text-sm">{isAr ? selectedLecture.bldgAr : selectedLecture.bldgEn}</p><p className="text-xs text-gray-500 mt-0.5 bg-gray-100 dark:bg-gray-700 px-2 py-0.5 rounded w-fit">{selectedLecture.room}</p></div></div>
                                    <div className="flex items-center gap-4 p-3"><div className="p-3 bg-teal-50 text-teal-600 rounded-full"><User size={20}/></div><div className="flex-1"><p className="font-bold text-gray-800 dark:text-white">{isAr ? selectedLecture.profAr : selectedLecture.profEn}</p></div></div>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="bg-white dark:bg-dark-card rounded-lg border border-gray-200 dark:border-gray-700 overflow-x-auto shadow-sm">
                        <table className="w-full min-w-[800px] text-center table-fixed border-collapse">
                            <thead className="bg-white dark:bg-dark-card text-gray-800 dark:text-white border-b border-gray-200 dark:border-gray-700">
                                <tr><th className="py-4 w-28 border-l border-gray-200 dark:border-gray-700"></th> {weekDays.map(day => (<th key={day} className="py-4 border-l border-gray-200 dark:border-gray-700 text-sm font-bold">{displayDays[day]}</th>))}</tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100 dark:divide-gray-700">
                                {timeSlots.map((slot) => (
                                    <tr key={slot.hour} className="h-24">
                                        <td className="p-2 bg-white dark:bg-dark-card text-gray-600 dark:text-gray-400 text-xs font-bold border-l border-gray-200 dark:border-gray-700 font-mono align-top pt-8">{slot.label}</td>
                                        {weekDays.map((day, dayIdx) => {
                                            const lecture = schedule?.[day]?.find(l => l.start === slot.hour);
                                            const isOccupied = schedule?.[day]?.some(l => slot.hour > l.start && slot.hour < l.start + l.dur);
                                            if (lecture) {
                                                return (<td key={dayIdx} rowSpan={lecture.dur} className="p-1 relative align-top h-full border-l border-gray-100 dark:border-gray-700/50"><button onClick={() => setSelectedLecture(lecture)} className={`w-full h-full rounded-lg ${lecture.color} ${lecture.text} flex flex-col items-center justify-center text-center shadow-sm hover:opacity-90 transition-opacity p-2 relative group`}><div className="flex flex-col items-center justify-center h-full w-full gap-1"><span className="font-bold text-base leading-tight">{isAr ? lecture.nameAr : lecture.nameEn}</span><span className="text-sm opacity-90 font-mono bg-black/10 px-1.5 rounded text-[10px]">{lecture.code}</span><span className="text-[10px] font-bold opacity-80 mt-1 dir-ltr font-mono tracking-wide">{formatTimeRange(lecture.start, lecture.dur)}</span></div></button></td>);
                                            }
                                            if (isOccupied) return null;
                                            return <td key={dayIdx} className="border-l border-gray-100 dark:border-gray-700/50"></td>
                                        })}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const PlanPage = ({ onBack, t, lang }) => {
            const isAr = lang === 'ar';
            const defaultLevels = [
                { id: 1, courses: [ { code: 'MATH101', nameAr: 'تفاضل وتكامل 1', nameEn: 'Calculus 1', status: 'eq', grade: 'EQ', hours: 4 }, { code: 'CS100', nameAr: 'مهارات حاسب', nameEn: 'Computer Skills', status: 'done', grade: 'A+', hours: 2 } ] },
                { id: 2, courses: [ { code: 'CS101', nameAr: 'مقدمة في البرمجة', nameEn: 'Intro to Programming', status: 'done', grade: 'B+', hours: 4, pre: 'CS100' } ] },
                { id: 3, courses: [ { code: 'CS201', nameAr: 'برمجة 1', nameEn: 'Programming 1', status: 'done', grade: 'A+', pre: 'CS101', hours: 4 } ] },
                { id: 4, courses: [ { code: 'CS204', nameAr: 'برمجة 2', nameEn: 'Programming 2', status: 'now', grade: '---', pre: 'CS201', hours: 4 } ] }

            const isAr = lang === 'ar';
            
            const defaultUpcomingExams = [
                { subjectAr: "التحليل الكيميائي", subjectEn: "Chemical Analysis", date: "2024-05-15", time: "09:00", roomAr: "109/ق6", roomEn: "109/C6", daysLeft: 2 },
                { subjectAr: "الإحصاء العملي", subjectEn: "Practical Statistics", date: "2024-05-20", time: "10:30", roomAr: "معمل 2", roomEn: "Lab 2", daysLeft: 7 }
            ];
            
            const defaultAttendanceData = [
                { nameAr: 'برمجة متقدمة', nameEn: 'Advanced Programming', absencePct: 0, excused: false },      
                { nameAr: 'تحليل كيميائي', nameEn: 'Chemical Analysis', absencePct: 12, excused: false },    
                { nameAr: 'إحصاء هندسي', nameEn: 'Engineering Statistics', absencePct: 20, excused: true },       
                { nameAr: 'فيزياء عامة', nameEn: 'General Physics', absencePct: 16, excused: false }
            ];

            const [student] = useFirebaseData('studentInfo', defaultStudentData);
            const [upcomingExams] = useFirebaseData('upcomingExams', defaultUpcomingExams);
            const [attendanceData] = useFirebaseData('attendanceOverview', defaultAttendanceData);

            const completed = student?.completedHours || 0;
            const current = student?.currentHours || 0;
            const total = student?.totalHours || 120;
            const remaining = total - (completed + current);
            const completedPct = (completed / total) * 100;
            const currentPct = (current / total) * 100;

            return (
                <div className="space-y-8 animate-fade-in">
                    <div className="bg-amber-50 dark:bg-amber-900/20 border-l-4 border-amber-500 p-4 rounded-r-xl shadow-sm flex items-start gap-4">
                        <div className="p-2.5 bg-amber-100 dark:bg-amber-800 rounded-full text-amber-600 dark:text-amber-200 shrink-0"><Bell size={24} className="animate-pulse"/></div>
                        <div className="flex-1"><h4 className="font-bold text-amber-800 dark:text-amber-100 text-sm md:text-base">{t.notificationTitle}</h4><p className="text-xs md:text-sm text-amber-700 dark:text-amber-200 mt-1 leading-relaxed font-medium">{t.notificationBody}</p></div>
                    </div>

                    <div>
                        <h3 className="text-sm font-bold text-gray-400 uppercase mb-4 tracking-wider flex items-center gap-2"><div className="w-1 h-4 bg-primary rounded-full"></div> {t.quickActions}</h3>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                            <ActionCard icon={<Calendar size={24}/>} title={t.schedule} onClick={() => openService('schedule')} />
                            <ActionCard icon={<FileText size={24}/>} title={t.results} onClick={() => openService('results')} color="gold" />
                            <ActionCard icon={<RefreshCw size={24}/>} title={t.addDrop} onClick={() => openService('addDrop')} color="blue" />
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 bg-primary rounded-2xl p-8 text-white shadow-xl relative overflow-hidden group flex flex-col justify-between">
                            <div className="absolute top-0 right-0 w-full h-full opacity-[0.07] bg-[url('https://www.transparenttextures.com/patterns/arabesque.png')]"></div>
                            <div className="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8">
                                <div><div className="inline-flex items-center gap-2 bg-black/20 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-medium text-teal-100 mb-4 border border-white/10"><TrendingUp size={14} className="text-gold" /> <span>{t.statusRegular}</span></div><h2 className="text-6xl font-bold text-white mb-2 tracking-tighter">{student?.gpa}</h2> <p className="text-teal-100 text-lg opacity-90">{t.gpa}</p></div>
                                <div className="bg-white/10 backdrop-blur-md p-4 rounded-xl border border-white/10 text-center min-w-[100px]"><span className="block text-3xl font-bold text-gold">{total}</span><span className="text-xs text-teal-100">{t['total-hours-label']}</span></div>
                            </div>
                            <div className="relative z-10 w-full">
                                <div className="flex justify-between text-xs text-teal-100 mb-2 font-medium"><span>{t.progress}</span><span>{Math.round(((completed + current)/total)*100)}%</span></div>
                                <div className="w-full h-4 bg-black/20 rounded-full overflow-hidden flex"><div className="h-full bg-white shadow-[0_0_10px_rgba(255,255,255,0.5)]" style={{ width: `${completedPct}%` }} title={`${t.hoursCompleted}: ${completed}`}></div><div className="h-full bg-gold shadow-[0_0_10px_rgba(177,142,81,0.5)]" style={{ width: `${currentPct}%` }} title={`${t.hoursCurrent}: ${current}`}></div></div>
                                <div className="grid grid-cols-3 gap-2 mt-4">
                                    <div className="bg-white/10 rounded-lg p-2 text-center border border-white/5"><div className="flex items-center justify-center gap-1.5 mb-1"><div className="w-2 h-2 rounded-full bg-white"></div><span className="text-[10px] text-teal-100">{t.hoursCompleted}</span></div><span className="text-lg font-bold text-white block leading-none">{completed}</span></div>
                                    <div className="bg-gold/20 rounded-lg p-2 text-center border border-gold/20"><div className="flex items-center justify-center gap-1.5 mb-1"><div className="w-2 h-2 rounded-full bg-gold"></div><span className="text-[10px] text-gold">{t.hoursCurrent}</span></div><span className="text-lg font-bold text-gold block leading-none">{current}</span></div>
                                    <div className="bg-black/20 rounded-lg p-2 text-center border border-white/5"><div className="flex items-center justify-center gap-1.5 mb-1"><div className="w-2 h-2 rounded-full bg-gray-400"></div><span className="text-[10px] text-gray-300">{t.hoursRemaining}</span></div><span className="text-lg font-bold text-gray-200 block leading-none">{remaining}</span></div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white dark:bg-dark-card rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col h-full min-h-[250px]">
                            <div className="p-4 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center bg-gray-50/50 dark:bg-gray-800/50"><h3 className="font-bold text-primary flex items-center gap-2 text-sm"><Clock size={16}/> {t.todaysLectures}</h3><div className="flex items-center gap-2"><span className="text-xs bg-primary/10 text-primary px-2 py-1 rounded font-bold">3</span><button onClick={() => openService('schedule')} className="text-xs text-primary font-bold hover:bg-primary/10 px-2 py-1 rounded transition">{t['view-all']}</button></div></div>
                            <div className="p-4 space-y-4 flex-1 overflow-y-auto">
                                <div className="flex gap-4 opacity-50"><div className="flex flex-col items-center"><div className="w-3 h-3 rounded-full bg-gray-300"></div><div className="w-0.5 h-full bg-gray-200 my-1"></div></div><div><h4 className="font-bold text-gray-500 text-sm line-through">{isAr ? "إحصاء هندسي" : "Engineering Statistics"}</h4><p className="text-xs text-gray-400">08:00 - 09:50</p></div></div>
                                <div className="flex gap-4"><div className="flex flex-col items-center"><div className="w-3 h-3 rounded-full bg-primary ring-4 ring-teal-100 animate-pulse"></div><div className="w-0.5 h-full bg-gray-200 my-1"></div></div><div className="bg-teal-50 p-3 rounded-lg border border-teal-100 w-full"><h4 className="font-bold text-primary text-sm">{isAr ? "تحليل كيميائي" : "Chemical Analysis"}</h4><p className="text-xs text-gray-600 mt-1">{isAr ? "معمل 3" : "Lab 3"} • {t.now}</p></div></div>
                                <div className="flex gap-4"><div className="flex flex-col items-center"><div className="w-3 h-3 rounded-full bg-gray-300 dark:bg-gray-600 border-2 border-white dark:border-dark-card"></div></div><div><h4 className="font-bold text-gray-700 dark:text-gray-300 text-sm">{isAr ? "تفاعل الإنسان والحاسب" : "HCI"}</h4><p className="text-xs text-gray-500">01:00 - 02:50 • {isAr ? "قاعة 12" : "Hall 12"}</p><span className="text-[10px] text-teal-600 font-bold bg-teal-50 px-1.5 rounded mt-1 inline-block">{t['upcoming-label']}</span></div></div>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white dark:bg-dark-card p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
                            <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-gray-800 dark:text-white flex items-center gap-2"><span className="w-1 h-5 bg-primary rounded-full"></span>{t.upcomingExams}</h3><button onClick={() => openService('exams')} className="text-xs text-primary font-bold hover:bg-primary/5 px-2 py-1 rounded transition">{t['view-all']}</button></div>
                            <div className="space-y-3">
                                {upcomingExams?.map((exam, i) => (
                                    <div key={i} className="flex gap-3 p-3 rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-100 dark:border-gray-700 relative overflow-hidden">
                                        {exam.daysLeft <= 3 && <div className="absolute top-0 right-0 w-1 h-full bg-red-500"></div>}
                                        <div className="flex flex-col items-center justify-center bg-white dark:bg-gray-700 rounded shadow-sm w-12 h-12 border border-gray-100 dark:border-gray-600"><span className="text-[10px] text-gray-500 dark:text-gray-400 font-bold">{t['month-may']}</span><span className="text-base font-bold text-primary dark:text-teal-400 font-mono">{new Date(exam.date).getDate()}</span></div>
                                        <div className="flex-1 py-0.5"><h4 className="font-bold text-gray-800 dark:text-gray-200 text-sm">{isAr ? exam.subjectAr : exam.subjectEn}</h4><div className="flex items-center gap-3 mt-1 text-xs text-gray-500 dark:text-gray-400"><span className="flex items-center gap-1"><Clock size={12}/> {exam.time}</span><span className="flex items-center gap-1"><MapPin size={12}/> {isAr ? exam.roomAr : exam.roomEn}</span></div></div>
                                        <span className={`self-start text-[10px] px-2 py-0.5 rounded-full font-bold ${exam.daysLeft <= 3 ? 'bg-red-100 text-red-600' : 'bg-blue-50 text-blue-600'}`}>{t.hoursRemaining} {exam.daysLeft} {t['days-label']}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="bg-white dark:bg-dark-card p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
                            <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-gray-800 dark:text-white flex items-center gap-2"><span className="w-1 h-5 bg-primary rounded-full"></span>{t.attendance}</h3><button onClick={() => openService('absences')} className="text-xs text-primary font-bold hover:bg-primary/5 px-2 py-1 rounded transition">{t['view-all']}</button></div>
                             <div className="space-y-6">
                                {attendanceData?.map((item, idx) => {
                                    const progressPercent = Math.min((item.absencePct / 25) * 100, 100);
                                    let statusColor = "bg-green-500", statusText = ""; 
                                    if (item.absencePct === 0) { statusColor = "bg-emerald-500"; statusText = t['status-perfect']; } else if (item.absencePct < 10) { statusColor = "bg-green-500"; statusText = t['status-safe']; } else if (item.absencePct >= 10 && item.absencePct < 15) { statusColor = "bg-yellow-500"; statusText = t['status-warning']; } else if (item.absencePct >= 15) { if (item.excused) { statusColor = "bg-orange-400"; statusText = t['status-high-excused']; } else { statusColor = "bg-red-600"; statusText = t['status-denial']; } }
                                    return (
                                        <div key={idx} className="mb-2">
                                            <div className="flex justify-between items-center mb-1"><span className="font-bold text-gray-700 dark:text-gray-300 text-sm">{isAr ? item.nameAr : item.nameEn}</span><div className="flex items-center gap-2">{statusText && (<span className={`text-[10px] px-2 py-0.5 rounded font-bold text-white shadow-sm ${statusColor}`}>{statusText}</span>)}<span className={`text-[10px] font-bold ${item.absencePct >= 15 && !item.excused ? 'text-red-500' : 'text-gray-500'}`}>{item.absencePct}%</span></div></div>
                                            <div className="relative w-full h-10"><div className="absolute top-3 w-full h-2.5 bg-gray-100 dark:bg-gray-700 rounded-full overflow-visible"><div className="absolute inset-0 rounded-full overflow-hidden"><div className={`h-full transition-all duration-1000 ${statusColor}`} style={{ width: `${progressPercent}%` }}></div></div><div className="absolute -top-1 bottom-0 w-0.5 bg-gray-300 dark:bg-gray-600 z-10" style={{ right: '60%' }}></div><div className="absolute top-4 text-[9px] font-bold text-gray-400 translate-x-1/2" style={{ right: '60%' }}>15%</div><div className="absolute -top-1 bottom-0 w-0.5 bg-red-300 dark:bg-red-800 z-10" style={{ right: '99%' }}></div><div className="absolute top-4 text-[9px] font-bold text-red-400 translate-x-full" style={{ right: '99%' }}>25%</div><div className="absolute top-4 text-[9px] text-gray-400" style={{ right: '0%' }}>0%</div></div></div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [activeCategory, setActiveCategory] = useState(null);
            const [darkMode, setDarkMode] = useState(false);
            const [lang, setLang] = useState('ar');
            const [menuOpen, setMenuOpen] = useState(false);
            const [zoomLevel, setZoomLevel] = useState(100);
            const [isReaderActive, setIsReaderActive] = useState(false);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [reduceMotion, setReduceMotion] = useState(false);
            const [highlightLinks, setHighlightLinks] = useState(false);

            // Access global student data from Firebase to show in SideMenu
            const [student] = useFirebaseData('studentInfo', defaultStudentData);

            useEffect(() => { document.documentElement.classList.toggle('dark', darkMode); }, [darkMode]);
            useEffect(() => { document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; }, [lang]);
            useEffect(() => { document.documentElement.style.fontSize = `${zoomLevel}%`; }, [zoomLevel]);
            useEffect(() => { reduceMotion ? document.documentElement.classList.add('reduce-motion') : document.documentElement.classList.remove('reduce-motion'); }, [reduceMotion]);
            useEffect(() => { highlightLinks ? document.documentElement.classList.add('highlight-links') : document.documentElement.classList.remove('highlight-links'); }, [highlightLinks]);

            useEffect(() => {
                const handleScreenClick = (e) => {
                    if (!isReaderActive) return;
                    window.speechSynthesis.cancel(); 
                    const textToRead = e.target.innerText || e.target.textContent;
                    if (textToRead && textToRead.trim() !== '') {
                        const utterance = new SpeechSynthesisUtterance(textToRead.trim());
                        utterance.lang = lang === 'ar' ? 'ar-SA' : 'en-US';
                        utterance.rate = 0.9; 
                        window.speechSynthesis.speak(utterance);
                    }
                };
                isReaderActive ? document.addEventListener('click', handleScreenClick) : window.speechSynthesis.cancel();
                return () => document.removeEventListener('click', handleScreenClick);
            }, [isReaderActive, lang]);

            const t = translations[lang];
            const isAr = lang === 'ar';
            const goHome = () => setView('home');

            const menuItems = [
                { id: 'academic', icon: <GraduationCap size={20}/>, subItems: [ { id: 'schedule' }, { id: 'academic-events' }, { id: 'exams' }, { id: 'plan' }, { id: 'results' }, { id: 'absences' }, { id: 'record' } ] },
                { id: 'registration', icon: <CheckCircle2 size={20}/>, subItems: [ { id: 'offered-courses' }, { id: 'addDrop' }, { id: 'dept-add' }, { id: 'dept-change' }, { id: 'dept-drop' }, { id: 'dept-multi' }, { id: 'reg-requests' }, { id: 'withdraw' } ] },
                { id: 'requests', icon: <FileText size={20}/>, subItems: [ { id: 'academic-action-new' }, { id: 'academic-action-view' }, { id: 'major-change-new' }, { id: 'major-change-view' }, { id: 'recommendation-new' }, { id: 'recommendation-view' }, { id: 'office-hours-book' }, { id: 'office-hours-view' } ] },
                { id: 'personal', icon: <User size={20}/>, subItems: [ { id: 'penalties' }, { id: 'rewards' }, { id: 'finance' }, { id: 'docs' }, { id: 'allowances' }, { id: 'id-photo' } ] }
            ];

            const toggleCategory = (id) => setActiveCategory(activeCategory === id ? null : id);
            const openNotifications = () => setView('notifications');

            const renderContent = () => {
                switch(view) {
                    case 'student-dashboard': return <StudentDashboardPage onBack={goHome} lang={lang} />; 
                    case 'notifications': return <NotificationsPage onBack={goHome} lang={lang} />;
                    case 'academic-events': return <AcademicEventsPage onBack={goHome} lang={lang} />;
                    case 'schedule': return <SchedulePage onBack={goHome} t={t} lang={lang} />;
                    case 'plan': return <PlanPage onBack={goHome} t={t} lang={lang} />;
                    case 'results': return <ResultsPage onBack={goHome} t={t} lang={lang} onOpenNotifications={openNotifications} />;
                    case 'addDrop': return <AddDropPage onBack={goHome} lang={lang} />;
                    
                    case 'offered-courses': return <OfferedCoursesPage onBack={goHome} lang={lang} />;
                    case 'dept-add': return <DepartmentRequestPage onBack={goHome} type="add" lang={lang} />;
                    case 'dept-change': return <DepartmentRequestPage onBack={goHome} type="change" lang={lang} />;
                    case 'dept-drop': return <DepartmentRequestPage onBack={goHome} type="drop" lang={lang} />;
                    case 'dept-multi': return <MultiRequestPage onBack={goHome} lang={lang} />; 
                    case 'reg-requests': return <RegistrationRequestsPage onBack={goHome} lang={lang} />;
                    case 'withdraw': return <WithdrawPage onBack={goHome} lang={lang} />;

                    case 'exams': return <ExamsPage onBack={goHome} lang={lang} />;
                    case 'e-reg': return <RegistrationPage onBack={goHome} lang={lang} />;
                    case 'absences': return <AbsencesPage onBack={goHome} lang={lang} />;
                    case 'record': return <AcademicRecordPage onBack={goHome} lang={lang} t={t} onOpenNotifications={openNotifications} />; 
                    
                    case 'academic-action-new': return <NewAcademicActionPage onBack={goHome} lang={lang} />;
                    case 'academic-action-view': return <ViewAcademicActionsPage onBack={goHome} lang={lang} />;
                    case 'major-change-new': return <MajorChangeRequestPage onBack={goHome} lang={lang} />;
                    case 'major-change-view': return <ViewMajorChangeRequestsPage onBack={goHome} lang={lang} />;
                    case 'recommendation-new': return <NewRecommendationPage onBack={goHome} lang={lang} />;
                    case 'recommendation-view': return <ViewRecommendationsPage onBack={goHome} lang={lang} />;
                    case 'office-hours-book': return <OfficeHoursBookPage onBack={goHome} lang={lang} />;
                    case 'office-hours-view': return <OfficeHoursViewPage onBack={goHome} lang={lang} />;

                    case 'id-photo': return <PersonalPage onBack={goHome} activeView="id-photo" lang={lang} />;
                    case 'finance': return <PersonalPage onBack={goHome} activeView="finance" lang={lang} />;
                    case 'rewards': return <PersonalPage onBack={goHome} activeView="rewards" lang={lang} />;
                    case 'penalties': return <PersonalPage onBack={goHome} activeView="penalties" lang={lang} />;
                    case 'allowances': return <PersonalPage onBack={goHome} activeView="allowances" lang={lang} />;
                    case 'docs': return <PersonalPage onBack={goHome} activeView="docs" lang={lang} />;
                    case 'profile': return <PersonalPage onBack={goHome} activeView="id-photo" lang={lang} />;
                    case 'user-account': return <UserAccountPage onBack={goHome} lang={lang} />;
                    default: return <HomeView t={t} openService={setView} lang={lang} />;
                }
            };

            return (
                <div className="min-h-screen relative flex">
                    <aside className={`md:flex flex-col w-72 bg-white dark:bg-dark-card border-l dark:border-l-0 dark:border-r border-gray-200 dark:border-gray-800 fixed top-0 bottom-0 z-40 shadow-sm transition-all duration-300 ${isAr ? 'right-0 border-l' : 'left-0 border-r'} ${menuOpen ? 'translate-x-0' : (isAr ? 'translate-x-full' : '-translate-x-full')} md:translate-x-0`}>
                        <div className="p-8 flex items-center gap-3 mb-2">
                            <div className="w-12 h-12 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg"><GraduationCap size={28}/></div>
                            <div><h1 className="font-bold text-xl tracking-tight text-primary dark:text-teal-400">{t.appTitle}</h1><p className="text-[10px] text-gray-400">{t.uniName}</p></div>
                        </div>
                        
                        <div className="px-4 mb-4 space-y-2">
                             <button onClick={() => setView('home')} className={`w-full flex items-center gap-4 px-4 py-3 rounded-lg text-sm font-bold transition-all ${view === 'home' ? 'bg-primary text-white shadow-md' : 'text-gray-600 hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-gray-800'}`}><LayoutDashboard size={20}/> {t.dashboard}</button>
                             <button onClick={() => setView('student-dashboard')} className={`w-full flex items-center gap-4 px-4 py-3 rounded-lg text-sm font-bold transition-all ${view === 'student-dashboard' ? 'bg-primary text-white shadow-md' : 'text-gray-600 hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-gray-800'}`}><PieChart size={20}/> {t['student-dashboard']}</button>
                        </div>

                        <nav className="flex-1 px-4 space-y-1 overflow-y-auto pb-4 custom-scrollbar">
                            {menuItems.map(cat => (
                                <div key={cat.id} className="rounded-lg overflow-hidden">
                                    <button onClick={() => toggleCategory(cat.id)} className={`w-full flex items-center justify-between px-4 py-3 text-sm font-bold transition-all ${activeCategory === cat.id ? 'bg-gray-50 dark:bg-gray-800/50 text-primary' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800'}`}>
                                        <div className="flex items-center gap-3">{cat.icon} {t[cat.id]}</div><ChevronDown size={16} className={`transition-transform duration-300 ${activeCategory === cat.id ? 'rotate-180' : ''}`}/>
                                    </button>
                                    <div className={`overflow-hidden transition-all duration-300 ease-in-out ${activeCategory === cat.id ? 'max-h-96 opacity-100' : 'max-h-0 opacity-0'}`}>
                                        <div className="bg-gray-50 dark:bg-gray-800/30 py-2 pr-11 pl-4 space-y-1">
                                            {cat.subItems.map(item => (
                                                <button key={item.id} onClick={() => { setView(item.id); if(window.innerWidth < 768) setMenuOpen(false); }} className={`w-full text-right text-xs font-bold py-2 px-2 rounded-lg transition-colors flex items-center gap-2 ${view === item.id ? 'text-primary bg-primary/5' : 'text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white'}`}>
                                                    <div className={`w-1.5 h-1.5 rounded-full ${view === item.id ? 'bg-primary' : 'bg-gray-300'}`}></div>{t[item.id]}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </nav>

                        <div className="p-4 border-t border-gray-100 dark:border-gray-800">
                             <button onClick={() => { setView('user-account'); if(window.innerWidth < 768) setMenuOpen(false); }} className="w-full flex items-center gap-3 p-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 cursor-pointer transition text-right">
                                <div className="w-10 h-10 rounded-full bg-gray-200 overflow-hidden border border-gray-300"><div className="w-full h-full bg-gray-200 flex items-center justify-center text-gray-400"><User size={20}/></div></div>
                                <div className="overflow-hidden"><h4 className="font-bold text-xs truncate text-gray-800 dark:text-gray-200">{isAr ? student?.nameAr : student?.nameEn}</h4><p className="text-[10px] text-gray-400 truncate">{student?.id}</p></div>
                             </button>
                        </div>
                    </aside>
                    
                    {menuOpen && <div className="fixed inset-0 bg-black/50 z-30 md:hidden" onClick={() => setMenuOpen(false)}></div>}

                    <main className={`flex-1 w-full pb-20 md:pb-10 transition-all duration-300 ${isAr ? 'md:mr-72' : 'md:ml-72'}`}>
                        <header className="bg-white/80 dark:bg-dark-card/80 backdrop-blur-md sticky top-0 z-30 border-b border-gray-200 dark:border-gray-800 px-6 py-4 flex justify-between items-center shadow-sm">
                            <button onClick={() => setMenuOpen(!menuOpen)} className="md:hidden p-2 hover:bg-gray-100 rounded-lg"><Menu size={24} className="text-gray-600"/></button>
                            <h2 className="text-xl font-bold text-gray-800 dark:text-white">{t[view] || t.dashboard}</h2>
                            <div className="flex gap-2 sm:gap-3 items-center relative">
                                <NotificationBell onClick={openNotifications} /> 
                                <div className="relative">
                                    <button onClick={() => setSettingsOpen(!settingsOpen)} className={`p-2 rounded-lg transition-all shadow-sm flex items-center justify-center gap-1.5 ${settingsOpen || reduceMotion || highlightLinks || isReaderActive ? 'bg-primary text-white shadow-primary/20' : 'bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-white hover:bg-gray-200 dark:hover:bg-gray-600'}`} title={isAr ? "إمكانية الوصول" : "Accessibility"}>
                                        <Accessibility size={20} className={settingsOpen ? "scale-110 transition-transform" : "transition-transform"} />
                                    </button>
                                    {settingsOpen && (
                                        <>
                                            <div className="fixed inset-0 z-40" onClick={() => setSettingsOpen(false)}></div>
                                            <div className={`absolute top-full mt-3 ${isAr ? 'left-0' : 'right-0'} w-72 bg-white dark:bg-dark-card rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700 z-50 p-5 animate-fade-in`}>
                                                <h4 className="text-sm font-bold text-gray-800 dark:text-white mb-4 border-b border-gray-100 dark:border-gray-700 pb-3 flex items-center gap-2"><Accessibility size={18} className="text-primary"/>{isAr ? 'إمكانية الوصول' : 'Accessibility'}</h4>
                                                <div className="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
                                                    <div className="flex items-center justify-between"><span className="text-xs font-bold text-gray-600 dark:text-gray-300">{isAr ? 'اللغة' : 'Language'}</span><button onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')} className="px-3 py-1.5 bg-gray-100 dark:bg-gray-800 rounded-lg text-xs font-bold text-gray-800 dark:text-white hover:bg-gray-200 dark:hover:bg-gray-700 transition shadow-sm border border-gray-200 dark:border-gray-600">{lang === 'ar' ? 'English' : 'العربية'}</button></div>
                                                    <div className="flex items-center justify-between"><span className="text-xs font-bold text-gray-600 dark:text-gray-300">{isAr ? 'المظهر' : 'Theme'}</span><button onClick={() => setDarkMode(!darkMode)} className="p-2 bg-gray-100 dark:bg-gray-800 rounded-lg text-yellow-500 hover:bg-gray-200 dark:hover:bg-gray-700 transition shadow-sm border border-gray-200 dark:border-gray-600">{darkMode ? <Sun size={16}/> : <Moon size={16} className="text-gray-600 dark:text-gray-300"/>}</button></div>
                                                    <div className="flex items-center justify-between"><span className="text-xs font-bold text-gray-600 dark:text-gray-300">{isAr ? 'حجم الخط' : 'Font Size'} ({zoomLevel}%)</span><div className="flex gap-1.5"><button onClick={() => setZoomLevel(prev => Math.min(prev + 10, 130))} className="p-1.5 bg-gray-100 dark:bg-gray-800 rounded-lg text-xs font-bold w-8 h-8 flex items-center justify-center text-gray-800 dark:text-white hover:bg-gray-200 dark:hover:bg-gray-700 transition shadow-sm border border-gray-200 dark:border-gray-600">A+</button><button onClick={() => setZoomLevel(prev => Math.max(prev - 10, 80))} className="p-1.5 bg-gray-100 dark:bg-gray-800 rounded-lg text-xs font-bold w-8 h-8 flex items-center justify-center text-gray-800 dark:text-white hover:bg-gray-200 dark:hover:bg-gray-700 transition shadow-sm border border-gray-200 dark:border-gray-600">A-</button></div></div>
                                                    <div className="flex items-center justify-between"><span className="text-xs font-bold text-gray-600 dark:text-gray-300">{isAr ? 'القارئ الصوتي' : 'Screen Reader'}</span><button onClick={toggleSpeech} className={`p-2 rounded-lg transition-all shadow-sm border ${isReaderActive ? 'bg-primary text-white border-primary' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-600 hover:bg-gray-200 dark:hover:bg-gray-700'}`}>{isReaderActive ? <Volume2 size={16} className="animate-pulse"/> : <VolumeX size={16}/>}</button></div>
                                                    <div className="flex items-center justify-between"><span className="text-xs font-bold text-gray-600 dark:text-gray-300">{isAr ? 'تمييز الأزرار والروابط' : 'Highlight Links'}</span><button onClick={() => setHighlightLinks(!highlightLinks)} className={`p-2 rounded-lg transition-all shadow-sm border ${highlightLinks ? 'bg-primary text-white border-primary' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-600 hover:bg-gray-200 dark:hover:bg-gray-700'}`}><MousePointerClick size={16}/></button></div>
                                                    <div className="flex items-center justify-between"><span className="text-xs font-bold text-gray-600 dark:text-gray-300">{isAr ? 'إيقاف الحركات' : 'Reduce Motion'}</span><button onClick={() => setReduceMotion(!reduceMotion)} className={`p-2 rounded-lg transition-all shadow-sm border ${reduceMotion ? 'bg-primary text-white border-primary' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-600 hover:bg-gray-200 dark:hover:bg-gray-700'}`}><Activity size={16}/></button></div>
                                                </div>
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        </header>
                        <div id="main-content" className="p-6 max-w-7xl mx-auto">{renderContent()}</div>
                        <Chatbot t={t} />
                    </main>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
